<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>莫桑 - 扫码即玩</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", serif;
    background: #f5efe0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #fffef9;
    border-radius: 20px;
    padding: 40px 36px 32px;
    text-align: center;
    box-shadow: 0 4px 24px rgba(139,111,94,0.1);
    max-width: 320px;
  }
  .card h2 {
    font-size: 22px;
    color: #5c4a3a;
    margin-bottom: 4px;
    letter-spacing: 0.06em;
  }
  .card .sub {
    font-size: 13px;
    color: #8b7a62;
    margin-bottom: 20px;
  }
  #qr { display: inline-block; }
  .card .url {
    margin-top: 16px;
    font-size: 12px;
    color: #a09080;
    word-break: break-all;
  }
</style>
</head>
<body>

<div class="card">
  <h2>莫 桑</h2>
  <p class="sub">扫码即玩 · 黄昏山野闯关</p>
  <div id="qr"></div>
  <p class="url">zhu-space.github.io/my-web/game.html</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js">
</script>
<script>
new QRCode(document.getElementById("qr"), {
  text: "https://zhu-space.github.io/my-web/game.html",
  width: 200,
  height: 200,
  colorDark: "#5c4a3a",
  colorLight: "#ffffff",
  correctLevel: QRCode.CorrectLevel.M,
});
</script>
</body>
</html>
