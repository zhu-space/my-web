<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语链英训 · FSI 30 Units</title>
<style>
:root{--bg:#0a0a0a;--card:#141414;--border:#2a2a2a;--text:#eaeaea;--dim:#8b8b8b;--accent:#10b981;--warn:#f59e0b;--danger:#ef4444;--surface:#1c1c1c;--gold:#b8943e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:620px;padding:20px}

h1{font-size:1.2rem;margin-bottom:2px}
.sub{font-size:0.72rem;color:var(--dim);margin-bottom:16px}

/* Phase tabs */
.phase-tabs{display:flex;gap:4px;margin-bottom:12px}
.phase-tab{padding:6px 12px;border-radius:14px;font-size:0.7rem;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);transition:all 0.2s}
.phase-tab.active{background:var(--accent);color:#000;border-color:var(--accent)}
.phase-tab:not(.active):hover{border-color:var(--gold)}

/* Unit grid */
.unit-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.unit{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;cursor:pointer;transition:all 0.2s;display:flex;justify-content:space-between;align-items:center}
.unit:hover{border-color:var(--accent)}
.unit.active{border-color:var(--accent);background:rgba(16,185,129,0.06)}
.unit .u-num{font-size:0.65rem;color:var(--dim);width:40px}
.unit .u-name{flex:1;font-size:0.85rem}
.unit .u-desc{font-size:0.65rem;color:var(--dim)}
.unit .u-badge{font-size:0.6rem;padding:2px 8px;border-radius:8px;background:rgba(16,185,129,0.1);color:var(--accent)}

/* Bottom bar */
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:620px;background:var(--bg);border-top:1px solid var(--border);padding:16px 20px 24px;z-index:50}

/* Settings */
.settings{display:flex;gap:8px;margin-bottom:8px}
.settings input{flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:0.72rem}
.settings input:focus{outline:none;border-color:var(--accent)}
.btn-sm{padding:8px 14px;border-radius:8px;border:none;font-size:0.72rem;cursor:pointer;background:var(--accent);color:#000;font-weight:600}

/* Drill view (modal) */
#drillView{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:100;background:rgba(0,0,0,0.96)}
#drillView.show{display:flex;flex-direction:column}
#drillView .header{padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
#drillView .header .back{background:transparent;border:none;color:var(--dim);font-size:0.85rem;cursor:pointer}
#drillView .header .unit-title{font-size:0.85rem;font-weight:600}
#drillView .header .unit-stats{font-size:0.7rem;color:var(--dim);margin-left:auto}
#drillView .body{flex:1;overflow-y:auto;padding:20px}
#drillView .pattern{font-size:1.1rem;color:var(--text);margin-bottom:6px;line-height:1.7}
#drillView .pattern em{color:var(--warn);font-style:normal;font-weight:600;border-bottom:2px dashed var(--warn)}
#drillView .instruction{font-size:0.78rem;color:var(--dim);margin-bottom:16px}
#drillView .input-row{display:flex;gap:8px}
#drillView .input-row input{flex:1;padding:13px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:0.95rem}
#drillView .input-row input:focus{outline:none;border-color:var(--accent)}
#drillView .input-row input.correct{border-color:var(--accent);background:rgba(16,185,129,0.1)}
#drillView .input-row input.wrong{border-color:var(--danger);background:rgba(239,68,68,0.08)}
.feedback{padding:10px 14px;border-radius:10px;font-size:0.82rem;margin-top:8px;display:none}
.feedback.show{display:block}
.feedback.good{background:rgba(16,185,129,0.1);color:var(--accent)}
.feedback.bad{background:rgba(239,68,68,0.06);color:var(--danger)}
.btn-drill{padding:12px;border-radius:10px;border:none;font-size:0.85rem;font-weight:600;cursor:pointer;width:100%;margin-top:8px;transition:all 0.2s}
.btn-check{background:var(--accent);color:#000}
.btn-check:active{opacity:0.8}
.btn-next{background:var(--surface);color:var(--accent);border:1px solid var(--accent)}
.btn-speak{background:transparent;border:1px solid var(--border);color:var(--dim);padding:8px;border-radius:10px;font-size:0.75rem;cursor:pointer;margin-top:8px;width:100%}

.loading{text-align:center;padding:40px;color:var(--dim);font-size:0.85rem}
.error{color:var(--danger);font-size:0.78rem;margin-top:8px}

@media(max-width:480px){.app{padding:12px}.bottom{padding:12px 12px 20px}}
</style>
</head>
<body>
<div class="app" id="mainView">
  <h1>语链英训 · FSI Drills</h1>
  <div class="sub">30 套语言训练模块 · 外交官同款训练法</div>

  <div class="tabs" style="display:flex;gap:6px;margin-bottom:12px">
    <button class="tab-btn active" data-tab="units" onclick="switchTab('units')">📝 FSI Units</button>
    <button class="tab-btn" data-tab="vocab" onclick="switchTab('vocab')">📖 Ogden 850</button>
  </div>

  <div id="vocabPanel" style="display:none">
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input id="vocabSearch" placeholder="Search 850 words..." style="flex:1;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:0.82rem" oninput="filterVocab()">
      <button class="btn-sm" onclick="speakVocab()" style="padding:6px 12px">🔊</button>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px" id="vocabLetters"></div>
    <div id="vocabList" style="display:flex;flex-wrap:wrap;gap:6px;font-size:0.85rem;max-height:50vh;overflow-y:auto"></div>
  </div>

  <div id="unitsPanel">
  <div class="phase-tabs" id="phaseTabs">
    <button class="phase-tab active" data-phase="0">🔫 Phase 1 · 装弹</button>
    <button class="phase-tab" data-phase="1">🔵 Phase 2 · 连射</button>
    <button class="phase-tab" data-phase="2">🟡 Phase 3 · 实战</button>
  </div>
  <div class="unit-grid" id="unitGrid"></div>

  <div class="bottom">
    <div class="settings">
      <input id="apiKey" type="password" placeholder="DeepSeek API Key (optional)" style="flex:1">
      <button class="btn-sm" onclick="saveKey()">Save</button>
    </div>
  </div>
</div>

<div id="drillPanel" style="display:none;background:var(--card);border:1px solid var(--accent);border-radius:14px;padding:20px;margin-top:12px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <span style="font-weight:600;font-size:0.9rem" id="drillUnitTitle"></span>
    <div>
      <span style="font-size:0.7rem;color:var(--dim);margin-right:12px" id="drillUnitStats"></span>
      <button style="background:transparent;border:1px solid var(--border);color:var(--dim);padding:2px 10px;border-radius:8px;font-size:0.7rem;cursor:pointer" onclick="document.getElementById('drillPanel').style.display='none';curUnit=-1">✕ Close</button>
    </div>
  </div>
  <div id="drillContent"></div>
  <div class="loading" id="drillLoading" style="display:none;text-align:center;padding:20px;color:var(--dim)">Loading...</div>
</div>

<script>
// ==================== UNIT DATA ====================
const units = [
  // Phase 1 (0-9)
  {phase:0,num:1,name:'身份建立',desc:'系动词与身份认同',prompt:'你是一位FSI语言教官。请用JSON数组返回10组身份建立替换练习。每组包含pattern(句型模板用___标出替换位)、instruction(替换说明)、answer(完整正确答案)、hint(提示)。场景设定为外交场合。只返回JSON数组。格式：[{"pattern":"I ___ a ___.","instruction":"Replace ___ with \"am/diplomat\"","answer":"I am a diplomat.","hint":"I am a ___."}]'},
  {phase:0,num:2,name:'社交确认',desc:'一般疑问句与确认反馈',prompt:'你是一位FSI语言教官。请用JSON数组返回10组社交确认问答练习。每组包含pattern(问句模板)、instruction(替换说明)、answer(完整正确答案)、hint(提示)。场景设定为大使馆接待。只返回JSON。格式：[{"pattern":"___ you ___?","instruction":"Replace ___ with \"Are/a diplomat\"","answer":"Are you a diplomat?","hint":"___ you a ___?"}]'},
  {phase:0,num:3,name:'空间定位',desc:'存在感与方位反射',prompt:'你是一位FSI语言教官。请用JSON数组返回10组空间定位练习。每组包含pattern(用___标替换位)、instruction、answer、hint。场景设定为办公室与城市导航。只返回JSON。'},
  {phase:0,num:4,name:'数量感知',desc:'基数词与名词复数',prompt:'你是一位FSI语言教官。请用JSON数组返回10组数量感知练习。场景为物资清点与预算报告。每组含pattern/instruction/answer/hint。只返回JSON。'},
  {phase:0,num:5,name:'所属关系',desc:'物主代词与财产边界',prompt:'你是一位FSI语言教官。请用JSON数组返回10组所属关系练习(物主代词)。场景外交财产与文件归属。每组含pattern/instruction/answer/hint。只返回JSON。'},
  {phase:0,num:6,name:'意志表达',desc:'助动词与基本需求',prompt:'你是一位FSI语言教官。请用JSON数组返回10组意志表达练习(I want to/need to/would like to)。场景外交谈判需求沟通。每组含pattern/instruction/answer/hint。只返回JSON。'},

  {phase:0,num:9,name:'否定防御',desc:'否定结构与委婉拒绝',prompt:'你是一位FSI语言教官。请用JSON数组返回10组否定结构练习(I don\'t/He isn\'t/We can\'t)。场景外交委婉拒绝。每组含pattern/instruction/answer/hint。只返回JSON。'},

// ==================== STATE ====================
let apiKey = localStorage.getItem('fsi_apikey') || '';
let curPhase = 0, curUnit = -1, drills = [], drillIdx = 0, correctCount = 0, totalCount = 0, curTab = 'units';

// ==================== RENDER MAIN ====================
function renderUnits() {
  const grid = document.getElementById('unitGrid');
  grid.innerHTML = units.filter(u => u.phase === curPhase).map((u,i) => `
    <div class="unit" onclick="openUnit(${units.indexOf(u)})" id="unitRow${units.indexOf(u)}">

// ==================== OPEN UNIT ====================
async function openUnit(idx) {
  curUnit = idx; drillIdx = 0; correctCount = 0; totalCount = 0;
  var u = units[idx];
  var panel = document.getElementById('drillPanel');
  panel.style.display = 'block';
  document.getElementById('drillUnitTitle').textContent = 'Unit ' + u.num + ' · ' + u.name;
  document.getElementById('drillUnitStats').textContent = 'Generating...';
  document.getElementById('drillContent').innerHTML = '';
  document.getElementById('drillLoading').style.display = 'block';
  panel.scrollIntoView({behavior:'smooth'});

  var generated = null;
  if (apiKey) {
    try {
      var res = await fetch('https://api.deepseek.com/chat/completions', {method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},body:JSON.stringify({model:'deepseek-chat',messages:[{role:'user',content:u.prompt}],temperature:0.7,max_tokens:1500})});
      if (res.ok) { var d = await res.json(); var text = d.choices[0].message.content.trim(); var match = text.match(/\[[\s\S]*\]/); if (match) generated = JSON.parse(match[0]); }
    } catch(e) {}
  }
  if (!generated || !generated.length) generated = generateFallback(idx);
  drills = generated;
  document.getElementById('drillLoading').style.display = 'none';
  renderDrill();
}

// Word banks for randomization
// Simplest words from Ogden 850, RAZ C/D friendly
var wordBanks = {
  careers:['teacher','doctor','farmer','cook','sailor','pilot','student','worker','driver','nurse'],
  things:['book','pen','bag','cup','ball','hat','box','bed','map','bell'],
  places:['school','park','farm','room','house','store','road','river','garden','sea'],
  animals:['cat','dog','bird','fish','horse','sheep','cow','pig','goat','frog'],
  times:['morning','night','today','tomorrow','summer','winter','week','day','year','spring'],
  adjectives:['big','small','hot','cold','good','new','old','red','blue','green'],
  actions:['run','jump','swim','read','cook','sing','play','eat','sleep','walk'],
  subjects:['I','She','He','We','They'],
  verbs_be:['am','is','are'],
};

function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function generateFallback(idx) {
  var u = units[idx], phase = u.phase;
  // Randomize: generate 5 varied drills for any unit
  var drills = [];
  var subj, verb, obj, obj2;

  for (var i = 0; i < 5; i++) {
    if (idx === 0) {
      subj = pick(wordBanks.subjects); verb = pick(wordBanks.verbs_be); obj = pick(wordBanks.careers);
      drills.push({pattern:subj+' <em>'+verb+'</em> a <em>'+obj+'</em>.',instruction:'Change "'+obj+'" to another career',answer:subj+' '+verb+' a '+obj+'.',hint:subj+' '+verb+' a ___.'});
    } else if (idx === 1) {
      subj = pick(wordBanks.subjects); obj = pick(wordBanks.careers);
      verb = (subj==='I'||subj==='You'||subj==='We'||subj==='They')?'Are':'Is';
      drills.push({pattern:verb+' <em>'+subj+'</em> a <em>'+obj+'</em>?',instruction:'Form a question asking if '+subj+' is a '+obj,answer:verb+' '+subj+' a '+obj+'?',hint:verb+' '+subj+' a ___?'});
    } else if (idx === 2) {
      obj = pick(wordBanks.places); obj2 = pick(wordBanks.things);
      drills.push({pattern:'There <em>is</em> a <em>'+obj2+'</em> in the <em>'+obj+'</em>.',instruction:'Describe a '+obj2+' in the '+obj,answer:'There is a '+obj2+' in the '+obj+'.',hint:'There is a ___ in the ___.'});
    } else if (idx === 3) {
      obj = pick(wordBanks.things);
      drills.push({pattern:'I have <em>three</em> <em>'+obj+'s</em>.',instruction:'Count '+obj+'s (use a number)',answer:'I have three '+obj+'s.',hint:'I have ___ ___s.'});
    } else if (idx >= 4 && idx <= 5) {
      subj = pick(wordBanks.subjects); obj = pick(wordBanks.things);
      drills.push({pattern:subj+' <em>'+pick(['has','owns','keeps'])+'</em> a <em>'+obj+'</em>.',instruction:'Describe possession of a '+obj,answer:subj+' has a '+obj+'.',hint:subj+' ___ a ___.'});
    } else if (idx >= 6 && idx <= 7) {
      subj = pick(wordBanks.subjects); obj = pick(wordBanks.actions);
      drills.push({pattern:subj+' <em>'+pick(['likes','wants','needs'])+' to</em> <em>'+obj+'</em>.',instruction:'Talk about wanting to '+obj,answer:subj+' wants to '+obj+'.',hint:subj+' ___ to ___.'});
    } else {
      subj = pick(wordBanks.subjects); obj = pick(wordBanks.things); obj2 = pick(wordBanks.places);
      drills.push({pattern:subj+' <em>'+pick(['is','was','will be'])+'</em> at the <em>'+obj2+'</em>.',instruction:'Say where '+subj+' is',answer:subj+' is at the '+obj2+'.',hint:subj+' is at the ___.'});
    }
  }
  return drills;
}

// ==================== DRILL UI ====================
function renderDrill() {
  var content = document.getElementById('drillContent');
  var stats = document.getElementById('drillUnitStats');
  if (!content || !stats) return;
  if (drillIdx >= drills.length) {
    content.innerHTML = '<div style="text-align:center;padding:40px"><div style="font-size:2.5rem;margin-bottom:12px">🎯</div><div style="font-size:1.1rem;margin-bottom:6px">Unit Complete!</div><div style="color:var(--dim);font-size:0.85rem">' + correctCount + '/' + drills.length + ' correct</div><button class="btn-drill btn-next" onclick="closeDrill()" style="margin-top:20px">Back to Units</button></div>';
    stats.textContent = correctCount + '/' + drills.length;
    return;
  }
  var d = drills[drillIdx];
  stats.textContent = (drillIdx+1) + '/' + drills.length;
  var hintHTML = d.hint ? '<div style="font-size:0.7rem;color:var(--dim);margin-bottom:14px;background:var(--surface);padding:8px 12px;border-radius:8px">💡 ' + d.hint + '</div>' : '';
  content.innerHTML = '<div class="pattern">' + d.pattern + '</div><div class="instruction">' + d.instruction + '</div>' + hintHTML + '<div class="input-row"><input type="text" id="answerInput" placeholder="Type your answer..." autocomplete="off" onkeydown="if(event.key===\"Enter\")checkDrillAnswer()"></div><button class="btn-drill btn-check" onclick="checkDrillAnswer()" id="btnCheck">Check ✓</button><button class="btn-speak" onclick="speakDrill()">🔊 Listen</button><button class="btn-speak" id="btnSpeakDrill" onclick="speakDrillAnswer()" style="margin-top:4px;color:var(--accent);border-color:var(--accent)">🎤 Speak</button><div class="feedback" id="feedback"></div><button class="btn-drill btn-next" id="btnNext" style="display:none" onclick="nextDrill()">Next →</button>';
  setTimeout(function(){var inp=document.getElementById('answerInput');if(inp)inp.focus();},100);
  // Auto-speak the pattern for read-along
  setTimeout(function(){
    try { var txt = drills[drillIdx] ? drills[drillIdx].answer : ''; if (txt) { var u = new SpeechSynthesisUtterance(txt); u.lang = 'en-US'; u.rate = 0.8; speechSynthesis.cancel(); speechSynthesis.speak(u); } } catch(e){}
  }, 400);
}
}

function checkDrillAnswer(userSpoken) {
  var inp = document.getElementById('answerInput');
  var userAns = userSpoken || (inp ? inp.value.trim() : '');
  if (!userAns) return;
  var d = drills[drillIdx];
  var norm = function(s){ return s.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim(); };
  var isCorrect = norm(userAns) === norm(d.answer);
  totalCount++;
  var fb = document.getElementById('feedback');
  if (isCorrect) {
    correctCount++;
    if (inp) { inp.className = 'correct'; inp.value = d.answer; }
    fb.className = 'feedback show good'; fb.textContent = '✅ Correct!';
    try{ document.getElementById('btnCheck').style.display = 'none'; }catch(e){}
    try{ document.getElementById('btnNext').style.display = ''; }catch(e){}
    try{ document.getElementById('btnSpeakDrill').style.display = 'none'; }catch(e){}
  } else {
    if (inp && !userSpoken) { inp.className = 'wrong'; inp.select(); }
    fb.className = 'feedback show bad';
    fb.innerHTML = '❌ Expected: <strong>' + d.answer + '</strong>';
  }
}

// Voice input
var recognition = null;
window.speakDrillAnswer = function() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Your browser does not support speech recognition. Use Chrome.'); return; }
  if (!recognition) {
    recognition = new SR(); recognition.lang = 'en-US'; recognition.interimResults = false; recognition.continuous = false;
    recognition.onresult = function(event) {
      var transcript = event.results[0][0].transcript.trim();
      if (transcript) { document.getElementById('answerInput').value = transcript; checkDrillAnswer(transcript); }
    };
    recognition.onerror = function() { var btn = document.getElementById('btnSpeakDrill'); if (btn) { btn.style.background = 'transparent'; btn.textContent = '🎤 Speak'; } };
    recognition.onend = function() { var btn = document.getElementById('btnSpeakDrill'); if (btn) { btn.style.background = 'transparent'; btn.textContent = '🎤 Speak'; } };
  }
  if (curUnit < 0) return;
  var btn = document.getElementById('btnSpeakDrill');
  if (btn) { btn.style.background = 'var(--danger)'; btn.textContent = '🎙️ Listening...'; }
  recognition.start();
};

function nextDrill() { drillIdx++; renderDrill(); }
function speakDrill() {
  if (drillIdx < drills.length) {
    const u = new SpeechSynthesisUtterance(drills[drillIdx].answer);
    u.lang = 'en-US'; u.rate = 0.85;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }
}

function closeDrill() {
  document.getElementById('drillPanel').style.display = 'none';
  curUnit = -1;
}

renderUnits();

function switchTab(tab){curTab=tab;document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.toggle('active',b.dataset.tab===tab)});document.getElementById('vocabPanel').style.display=tab==='vocab'?'':'none';document.getElementById('unitsPanel').style.display=tab==='units'?'':'none';if(tab==='vocab')renderVocab()}
function renderVocab(){var letters=[];ogden850.forEach(function(w){var l=w[0].toUpperCase();if(letters.indexOf(l)<0)letters.push(l)});letters.sort();document.getElementById('vocabLetters').innerHTML=letters.map(function(l){return'<button class="phase-tab'+(vocabLetter===l?' active':'')+'" onclick="vocabLetter=\''+l+'\';renderVocab()" style="padding:4px 10px;font-size:0.7rem">'+l+'</button>'}).join('');var words=ogden850;if(vocabLetter)words=words.filter(function(w){return w[0].toUpperCase()===vocabLetter});var q=(document.getElementById('vocabSearch')||{}).value||'';if(q){var lq=q.toLowerCase();words=words.filter(function(w){return w.indexOf(lq)>=0})}document.getElementById('vocabList').innerHTML=words.map(function(w){return'<span style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer" onclick="speakWord(\''+w+'\')">'+w+'</span>'}).join('');if(!words.length)document.getElementById('vocabList').innerHTML='<span style="color:var(--dim);font-size:0.8rem">No words found</span>'}
function filterVocab(){vocabLetter='';renderVocab()}
function speakVocab(){var q=(document.getElementById('vocabSearch')||{}).value||'';var words=q?ogden850.filter(function(w){return w.indexOf(q)>=0}):ogden850;if(!words.length)return;var u=new SpeechSynthesisUtterance(words.slice(0,10).join(', '));u.lang='en-US';u.rate=0.9;speechSynthesis.cancel();speechSynthesis.speak(u)}
function speakWord(word){var u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=0.85;speechSynthesis.cancel();speechSynthesis.speak(u)}
