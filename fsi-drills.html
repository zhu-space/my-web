<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>句型训练 · FSI Pattern Drills</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#eee;padding:16px;max-width:500px;margin:0 auto}
h2{font-size:1.1rem;margin:0 0 16px;color:#10b981}
.card{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:16px;margin-bottom:12px}
.card .label{font-size:0.7rem;color:#888;margin-bottom:4px}
.card .sentence{font-size:1.05rem;margin-bottom:8px;line-height:1.6}
.card .sentence b{color:#f59e0b}
.card .task{font-size:0.78rem;color:#888;margin-bottom:10px}
.card .hint{font-size:0.7rem;color:#666;margin-bottom:8px;padding:6px 10px;background:#222;border-radius:6px}
input{width:100%;padding:10px;border-radius:8px;border:1px solid #333;background:#222;color:#eee;font-size:0.9rem;margin-bottom:8px;box-sizing:border-box}
input:focus{outline:none;border-color:#10b981}
button{border:none;border-radius:8px;padding:10px;font-size:0.85rem;cursor:pointer;font-weight:600;width:100%;margin-bottom:6px}
.btn-check{background:#10b981;color:#000}
.btn-next{background:#222;color:#10b981;border:1px solid #10b981;display:none}
.btn-speak{background:transparent;border:1px solid #333;color:#888;font-size:0.75rem}
.feedback{padding:8px 12px;border-radius:8px;font-size:0.8rem;margin:8px 0;display:none}
.feedback.good{display:block;background:rgba(16,185,129,0.1);color:#10b981}
.feedback.bad{display:block;background:rgba(239,68,68,0.08);color:#f87171}
.scorebar{display:flex;justify-content:space-between;font-size:0.7rem;color:#888;margin-bottom:12px}
select{padding:8px;border-radius:8px;border:1px solid #333;background:#222;color:#eee;font-size:0.8rem;margin-bottom:12px;width:100%}
</style>
</head>
<body>
<h2>FSI Pattern Drills</h2>

<div class="scorebar">
  <span>Score: <b id="score" style="color:#10b981">0</b></span>
  <span>Streak: <b id="streak" style="color:#f59e0b">0</b></span>
  <span id="progress"></span>
</div>

<select id="levelSelect" onchange="changeLevel(this.value)">
  <option value="0">Stage 1 · 基础句型</option>
  <option value="1">Stage 2 · 时态与逻辑</option>
  <option value="2">Stage 3 · 复杂结构</option>
</select>

<div class="card" id="card">
  <div class="label" id="unitName">Unit 1</div>
  <div class="sentence" id="pattern">---</div>
  <div class="task" id="task">---</div>
  <div class="hint" id="hint">💡 ---</div>
  <input type="text" id="answer" placeholder="Type your answer..." onkeydown="if(event.key==='Enter')checkAnswer()">
  <button class="btn-check" onclick="checkAnswer()" id="btnCheck">Check</button>
  <button class="btn-speak" onclick="listen()">Listen</button>
  <button class="btn-speak" onclick="speakAnswer()" style="border-color:#10b981;color:#10b981">Speak</button>
  <div class="feedback" id="fb"></div>
  <button class="btn-next" onclick="nextDrill()" id="btnNext">Next</button>
</div>

<script>
// ==================== DRILLS ====================
var allDrills = [
  // Stage 0: Basic
  [["I <b>am</b> a <b>student</b>.","Change student → teacher","I am a teacher.","I am a ___."],
   ["She <b>is</b> <b>tall</b>.","Change tall → short","She is short.","She is ___."],
   ["I <b>have</b> a <b>book</b>.","Change book → pen","I have a pen.","I have a ___."],
   ["He <b>likes</b> to <b>run</b>.","Change run → swim","He likes to swim.","He likes to ___."],
   ["There <b>is</b> a <b>cat</b> in the room.","Change cat → dog","There is a dog in the room.","There is a dog in the ___."],
   ["They <b>are</b> <b>playing</b>.","Change playing → working","They are working.","They are ___."],
   ["This <b>is</b> my <b>house</b>.","Change house → school","This is my school.","This is my ___."],
   ["I <b>want</b> to <b>eat</b>.","Change eat → cook","I want to cook.","I want to ___."],
   ["We <b>go</b> to <b>school</b> every day.","Change school → park","We go to park every day.","We go to ___ every day."],
   ["She <b>can</b> <b>sing</b> very well.","Change sing → dance","She can dance very well.","She can ___ very well."]],
  // Stage 1: Tenses & Logic
  [["I <b>will</b> go to <b>school</b> tomorrow.","Change school → hospital","I will go to hospital tomorrow.","I will go to ___ tomorrow."],
   ["She <b>has finished</b> her <b>work</b>.","Change work → homework","She has finished her homework.","She has finished her ___."],
   ["He <b>was reading</b> when I <b>arrived</b>.","Change reading → cooking","He was cooking when I arrived.","He was ___ when I arrived."],
   ["If it <b>rains</b>, we <b>will stay</b> home.","Change rains → snows","If it snows, we will stay home.","If it ___, we will stay home."],
   ["I <b>have been</b> studying <b>for two hours</b>.","Change two hours → three days","I have been studying for three days.","I have been studying for ___."],
   ["She <b>used to</b> live in <b>London</b>.","Change London → Paris","She used to live in Paris.","She used to live in ___."],
   ["<b>Although</b> it was late, <b>she kept working</b>.","Change she kept working → he went out","Although it was late, he went out.","Although it was late, ___."],
   ["I <b>should</b> <b>finish</b> this today.","Change should → must","I must finish this today.","I ___ finish this today."],
   ["We <b>have</b> lunch <b>at noon</b> every day.","Change at noon → at 12","We have lunch at 12 every day.","We have lunch ___ every day."],
   ["She <b>was</b> very <b>tired</b> after work.","Change tired → happy","She was very happy after work.","She was very ___ after work."]],
  // Stage 2: Complex
  [["<b>Had I known</b>, I <b>would have come</b>.","Change would have come → would have called","Had I known, I would have called.","Had I known, I ___."],
   ["The book, <b>which I bought yesterday</b>, is <b>very good</b>.","Change very good → very interesting","The book, which I bought yesterday, is very interesting.","The book... is very ___."],
   ["<b>Not only</b> did she arrive early, <b>but she also</b> helped.","Change she → he","Not only did he arrive early, but he also helped.","Not only did he arrive early, but he also ___."],
   ["<b>It is important that</b> every student <b>attend</b>.","Change attend → be present","It is important that every student be present.","It is important that every student ___."],
   ["<b>Barely</b> had I <b>started</b> when it <b>ended</b>.","Change started → sat down","Barely had I sat down when it ended.","Barely had I ___ when it ended."],
   ["<b>Were I</b> in your position, I <b>would think twice</b>.","Change would think twice → would accept","Were I in your position, I would accept.","Were I in your position, I ___."],
   ["<b>Much as</b> I like it, I <b>cannot afford</b> it.","Change cannot afford → must refuse","Much as I like it, I must refuse it.","Much as I like it, I ___ it."],
   ["The results <b>turned out</b> to be <b>wrong</b>.","Change wrong → correct","The results turned out to be correct.","The results turned out to be ___."],
   ["<b>So loud was</b> the noise that <b>nobody could sleep</b>.","Change nobody could sleep → everyone woke up","So loud was the noise that everyone woke up.","So loud was the noise that ___."],
   ["<b>By the time</b> we got there, it <b>had already closed</b>.","Change had already closed → was too late","By the time we got there, it was too late.","By the time we got there, it ___."]]
];

var currentDrill = {stage:0,idx:0,score:0,streak:0,total:0,correct:0};

function render() {
  var d = allDrills[currentDrill.stage][currentDrill.idx];
  document.getElementById('pattern').innerHTML = d[0];
  document.getElementById('task').textContent = d[1];
  document.getElementById('hint').innerHTML = '💡 ' + d[3];
  document.getElementById('unitName').textContent = 'Stage ' + (currentDrill.stage+1) + ' · Drill ' + (currentDrill.idx+1) + '/' + allDrills[currentDrill.stage].length;
  document.getElementById('answer').value = '';
  document.getElementById('answer').className = '';
  document.getElementById('fb').className = 'feedback';
  document.getElementById('btnCheck').style.display = '';
  document.getElementById('btnNext').style.display = 'none';
  document.getElementById('progress').textContent = 'Accuracy: ' + (currentDrill.total>0?Math.round(currentDrill.correct/currentDrill.total*100):0) + '%';
  document.getElementById('score').textContent = currentDrill.score;
  document.getElementById('streak').textContent = currentDrill.streak;
  // Auto-read
  setTimeout(function(){speakText(d[2])}, 500);
}

function changeLevel(lvl) {
  currentDrill.stage = parseInt(lvl); currentDrill.idx = 0; currentDrill.streak = 0;
  render();
}

function checkAnswer() {
  var inp = document.getElementById('answer');
  var ans = inp.value.trim();
  if (!ans) return;
  var d = allDrills[currentDrill.stage][currentDrill.idx];
  currentDrill.total++;
  var norm = function(s){return s.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/ +/g,' ').trim();};
  var fb = document.getElementById('fb');
  if (norm(ans) === norm(d[2])) {
    currentDrill.correct++; currentDrill.streak++;
    currentDrill.score += 10 + currentDrill.streak * 2;
    inp.className = ''; inp.style.borderColor = '#10b981';
    fb.className = 'feedback good'; fb.textContent = 'Correct! +' + (10+currentDrill.streak*2);
    document.getElementById('btnCheck').style.display = 'none';
    document.getElementById('btnNext').style.display = '';
  } else {
    currentDrill.streak = 0;
    inp.style.borderColor = '#f87171';
    fb.className = 'feedback bad';
    fb.innerHTML = 'Expected: <b>' + d[2] + '</b>';
    inp.select();
  }
  document.getElementById('score').textContent = currentDrill.score;
  document.getElementById('streak').textContent = currentDrill.streak;
}

function nextDrill() {
  currentDrill.idx++;
  if (currentDrill.idx >= allDrills[currentDrill.stage].length) currentDrill.idx = 0;
  render();
}

function speakText(txt) {
  var u = new SpeechSynthesisUtterance(txt);
  u.lang = 'en-US'; u.rate = 0.8;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function listen() {
  var d = allDrills[currentDrill.stage][currentDrill.idx];
  speakText(d[2]);
}

function speakAnswer() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert('Use Chrome for voice input'); return; }
  var r = new SR(); r.lang = 'en-US';
  r.onresult = function(e) {
    var txt = e.results[0][0].transcript.trim();
    if (txt) { document.getElementById('answer').value = txt; checkAnswer(); }
  };
  r.start();
}

render();
</script>
</body>
</html>
