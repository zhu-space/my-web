<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语链英训 · LinguaChain FSI Drills</title>
<style>
:root{--bg:#0a0a0a;--card:#141414;--border:#2a2a2a;--text:#eaeaea;--dim:#8b8b8b;--accent:#10b981;--warn:#f59e0b;--danger:#ef4444;--surface:#1c1c1c}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:600px;padding:20px}

h1{font-size:1.3rem;margin-bottom:4px}
.sub{font-size:0.75rem;color:var(--dim);margin-bottom:20px}

/* Level tabs */
.levels{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.levels::-webkit-scrollbar{display:none}
.lvl{padding:6px 14px;border-radius:16px;font-size:0.72rem;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);white-space:nowrap;transition:all 0.2s}
.lvl.active{background:var(--accent);color:#000;border-color:var(--accent)}
.lvl.done{background:rgba(16,185,129,0.15);color:var(--accent);border-color:rgba(16,185,129,0.3)}

/* Stats */
.stats{display:flex;gap:12px;margin-bottom:16px;font-size:0.72rem;color:var(--dim)}
.stats span{color:var(--accent);font-weight:600}

/* Drill card */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:12px}
.card .pattern{font-size:1.15rem;color:var(--text);margin-bottom:6px;line-height:1.6;letter-spacing:0.5px}
.card .pattern .hl{color:var(--warn);font-weight:600;border-bottom:2px dashed var(--warn)}
.card .prompt{font-size:0.78rem;color:var(--dim);margin-bottom:14px}
.card .hint{font-size:0.72rem;color:var(--dim);margin-bottom:10px;background:var(--surface);padding:8px 12px;border-radius:8px}

/* Input area */
.input-row{display:flex;gap:8px}
.input-row input{flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:0.95rem}
.input-row input:focus{outline:none;border-color:var(--accent)}
.input-row input.correct{border-color:var(--accent);background:rgba(16,185,129,0.1)}
.input-row input.wrong{border-color:var(--danger);background:rgba(239,68,68,0.08)}
.btn{width:100%;padding:12px;border-radius:10px;border:none;font-size:0.9rem;font-weight:600;cursor:pointer;transition:all 0.2s}
.btn-check{background:var(--accent);color:#000;margin-top:10px}
.btn-check:active{opacity:0.8}
.btn-speak{background:transparent;border:1px solid var(--border);color:var(--text);padding:12px;border-radius:10px;font-size:0.85rem;cursor:pointer;margin-top:8px;width:100%}
.btn-speak:active{background:var(--surface)}
.btn-next{background:var(--surface);color:var(--accent);border:1px solid var(--accent);margin-top:10px}
.btn-next:active{background:rgba(16,185,129,0.1)}

/* Feedback */
.feedback{padding:10px 14px;border-radius:10px;font-size:0.85rem;margin-top:10px;display:none}
.feedback.show{display:block}
.feedback.good{background:rgba(16,185,129,0.1);color:var(--accent)}
.feedback.bad{background:rgba(239,68,68,0.08);color:var(--danger)}

/* Audio btn */
.audio-btn{background:transparent;border:1px solid var(--border);color:var(--dim);padding:8px 14px;border-radius:16px;cursor:pointer;font-size:0.75rem;display:inline-flex;align-items:center;gap:4px;margin-bottom:12px}
.audio-btn:hover{border-color:var(--accent);color:var(--accent)}

.progress-bar{height:3px;background:var(--border);border-radius:2px;margin-bottom:20px}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width 0.3s}
</style>
</head>
<body>
<div class="app">
  <h1>语链英训 · LinguaChain</h1>
  <div class="sub">FSI Pattern Drills — 句型反射训练</div>

  <div class="levels" id="levels"></div>
  <div class="stats">
    Score: <span id="score">0</span> |
    Streak: <span id="streak">0</span> 🔥 |
    Accuracy: <span id="acc">0%</span>
    <button class="audio-btn" id="audioToggle" onclick="toggleAudio()" style="margin-left:auto">🔊 Audio</button>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressBar" style="width:0%"></div></div>

  <div class="card" id="drillCard">
    <div class="pattern" id="pattern"></div>
    <div class="prompt" id="prompt"></div>
    <div class="hint" id="hint" style="display:none"></div>
    <div class="input-row">
      <input type="text" id="answerInput" placeholder="Type your answer here..." autocomplete="off">
    </div>
    <button class="btn btn-check" id="btnCheck" onclick="checkAnswer()">Check ✓</button>
    <button class="btn btn-speak" id="btnSpeak" onclick="speakPattern()">🔊 Listen to pattern</button>
    <div class="feedback" id="feedback"></div>
    <button class="btn btn-next" id="btnNext" onclick="nextDrill()" style="display:none">Next →</button>
  </div>
</div>

<script>
// ==================== DRILL DATA ====================
const drills = {
  beginner: [
    {pattern:'I <hl>am</hl> a <hl>student</hl>.',prompt:'Replace "student" with "teacher"',answer:'I am a teacher.',hint:'I am a ____.',words:['teacher','doctor','worker','driver']},
    {pattern:'She <hl>is</hl> <hl>tall</hl>.',prompt:'Replace "tall" with "short"',answer:'She is short.',hint:'She is ____.',words:['short','kind','smart','brave']},
    {pattern:'I <hl>have</hl> a <hl>book</hl>.',prompt:'Replace "book" with "pen"',answer:'I have a pen.',hint:'I have a ____.',words:['pen','bag','phone','key']},
    {pattern:'He <hl>likes</hl> to <hl>run</hl>.',prompt:'Replace "run" with "swim"',answer:'He likes to swim.',hint:'He likes to ____.',words:['swim','read','cook','sing']},
    {pattern:'There <hl>is</hl> a <hl>cat</hl> in the room.',prompt:'Replace "cat" with "dog"',answer:'There is a dog in the room.',hint:'There is a ____ in the room.',words:['dog','bird','mouse','rabbit']},
    {pattern:'They <hl>are</hl> <hl>playing</hl> outside.',prompt:'Replace "playing" with "working"',answer:'They are working outside.',hint:'They are ____ outside.',words:['working','studying','eating','talking']},
    {pattern:'This <hl>is</hl> my <hl>house</hl>.',prompt:'Replace "house" with "office"',answer:'This is my office.',hint:'This is my ____.',words:['office','school','car','bag']},
    {pattern:'I <hl>want</hl> to <hl>eat</hl> lunch.',prompt:'Replace "eat" with "cook"',answer:'I want to cook lunch.',hint:'I want to ____ lunch.',words:['cook','make','buy','have']},
  ],
  elementary: [
    {pattern:'I <hl>have been</hl> <hl>studying</hl> English <hl>for two years</hl>.',prompt:'Change "studying" → "learning" and "for two years" → "since 2020"',answer:'I have been learning English since 2020.',hint:'I have been ____ English ____.',words:['learning|since 2020','working|for three months','living|since last year']},
    {pattern:'If it <hl>rains</hl>, I <hl>will stay</hl> home.',prompt:'Change "rains" → "snows"',answer:'If it snows, I will stay home.',hint:'If it ____, I will stay home.',words:['snows','storms','gets cold']},
    {pattern:'She <hl>can</hl> speak <hl>three languages</hl>.',prompt:'Change "three languages" → "French and Spanish"',answer:'She can speak French and Spanish.',hint:'She can speak ____.',words:['French and Spanish','very well','a little English']},
    {pattern:'The book <hl>was written</hl> by <hl>Mark Twain</hl>.',prompt:'Change "Mark Twain" → "a famous author"',answer:'The book was written by a famous author.',hint:'The book was written by ____.',words:['a famous author','an unknown writer','my teacher']},
    {pattern:'I <hl>would rather</hl> <hl>stay home</hl> than go out.',prompt:'Change "stay home" → "read a book"',answer:'I would rather read a book than go out.',hint:'I would rather ____ than go out.',words:['read a book','watch TV','cook dinner']},
    {pattern:'<hl>Despite</hl> the rain, we <hl>went</hl> hiking.',prompt:'Change "Despite" → "In spite of"',answer:'In spite of the rain, we went hiking.',hint:'____ the rain, we went hiking.',words:['In spite of','Regardless of','Notwithstanding']},
    {pattern:'He asked me <hl>if I could help</hl> him.',prompt:'Change "if I could help" → "whether I had seen"',answer:'He asked me whether I had seen him.',hint:'He asked me ____ him.',words:['whether I had seen','if I knew','what I thought about']},
    {pattern:'I <hl>used to</hl> play tennis <hl>every weekend</hl>.',prompt:'Change "every weekend" → "when I was young"',answer:'I used to play tennis when I was young.',hint:'I used to play tennis ____.',words:['when I was young','in high school','at the club']},
  ],
  intermediate: [
    {pattern:'<hl>Had I known</hl> about the meeting, I <hl>would have attended</hl>.',prompt:'Change to "Had she told me" / "I could have prepared"',answer:'Had she told me about the meeting, I could have prepared.',hint:'____ about the meeting, I ____.',words:['Had she told me|could have prepared','Had we been informed|might have come','Had I seen the email|would have replied']},
    {pattern:'The project, <hl>which was completed last month</hl>, <hl>exceeded</hl> expectations.',prompt:'Change "which was completed last month" → "which took six months"',answer:'The project, which took six months, exceeded expectations.',hint:'The project, ____, exceeded expectations.',words:['which took six months','despite the delays','to my surprise']},
    {pattern:'<hl>Not only</hl> did she finish early, <hl>but she also</hl> helped others.',prompt:'Change to start with He / "but he also"',answer:'Not only did he finish early, but he also helped others.',hint:'Not only did he finish early, ____.',words:['but he also helped others','but he stayed to clean up','and he volunteered for more']},
    {pattern:'<hl>It is essential that</hl> every student <hl>submit</hl> the form.',prompt:'Change "submit" → "complete" (subjunctive mood)',answer:'It is essential that every student complete the form.',hint:'It is essential that every student ____ the form.',words:['complete','review','sign']},
    {pattern:'<hl>Were I</hl> in your position, I <hl>would reconsider</hl>.',prompt:'Change "would reconsider" → "might take a different approach"',answer:'Were I in your position, I might take a different approach.',hint:'Were I in your position, I ____.',words:['might take a different approach','would think twice','could ask for advice']},
    {pattern:'The results <hl>turned out to be</hl> <hl>more promising than anticipated</hl>.',prompt:'Change "more promising than anticipated" → "surprisingly accurate"',answer:'The results turned out to be surprisingly accurate.',hint:'The results turned out to be ____.',words:['surprisingly accurate','less reliable','exactly what we needed']},
    {pattern:'<hl>By the time</hl> we arrived, the show <hl>had already started</hl>.',prompt:'Change "had already started" → "was nearly over"',answer:'By the time we arrived, the show was nearly over.',hint:'By the time we arrived, the show ____.',words:['was nearly over','had finished','was halfway through']},
    {pattern:'<hl>No matter how</hl> hard I try, I <hl>can\'t seem to</hl> get it right.',prompt:'Change "can\'t seem to" → "never manage to"',answer:'No matter how hard I try, I never manage to get it right.',hint:'No matter how hard I try, I ____ get it right.',words:['never manage to','still cannot','sometimes fail to']},
  ],
  advanced: [
    {pattern:'<hl>Barely</hl> had the meeting <hl>begun</hl> when the fire alarm <hl>went off</hl>.',prompt:'Change to "Hardly" / "concluded" / "the power went out"',answer:'Hardly had the meeting concluded when the power went out.',hint:'____ had the meeting ____ when ____.',words:['Hardly|concluded|the power went out','Scarcely|adjourned|someone started shouting','Rarely|ended|everyone agreed']},
    {pattern:'<hl>Much as</hl> I admire his work, I <hl>can\'t help but</hl> question his methods.',prompt:'Change "can\'t help but" → "find it difficult not to"',answer:'Much as I admire his work, I find it difficult not to question his methods.',hint:'Much as I admire his work, I ____ question his methods.',words:['find it difficult not to','cannot help','am compelled to']},
    {pattern:'<hl>It goes without saying that</hl> the decision <hl>was met with</hl> considerable resistance.',prompt:'Change "was met with" → "provoked" and rephrase end',answer:'It goes without saying that the decision provoked considerable resistance.',hint:'It goes without saying that the decision ____.',words:['provoked considerable resistance','generated heated debate','left many people disappointed']},
    {pattern:'<hl>Were it not for</hl> her intervention, the deal <hl>would have fallen</hl> through.',prompt:'Change "would have fallen" → "might never have materialized"',answer:'Were it not for her intervention, the deal might never have materialized.',hint:'Were it not for her intervention, the deal ____.',words:['might never have materialized','would likely have collapsed','could have been lost']},
    {pattern:'<hl>In light of</hl> recent events, we <hl>have no choice but to</hl> postpone indefinitely.',prompt:'Change "In light of" → "Given the gravity of"',answer:'Given the gravity of recent events, we have no choice but to postpone indefinitely.',hint:'____ recent events, we have no choice but to postpone indefinitely.',words:['Given the gravity of','In consideration of','Taking into account']},
    {pattern:'<hl>So profound was</hl> the impact that <hl>it reshaped</hl> the entire industry.',prompt:'Change "it reshaped" → "the entire landscape was transformed"',answer:'So profound was the impact that the entire landscape was transformed.',hint:'So profound was the impact that ____.',words:['the entire landscape was transformed','nothing remained the same','every competitor had to adapt']},
    {pattern:'<hl>Not for a moment</hl> did I believe that the plan <hl>would succeed</hl>.',prompt:'Change "would succeed" → "was feasible"',answer:'Not for a moment did I believe that the plan was feasible.',hint:'Not for a moment did I believe that the plan ____.',words:['was feasible','could work','would hold up']},
    {pattern:'<hl>Be that as it may</hl>, the evidence <hl>speaks for</hl> itself.',prompt:'Change "speaks for" → "does not lie, and we must act accordingly"',answer:'Be that as it may, the evidence does not lie, and we must act accordingly.',hint:'Be that as it may, the evidence ____.',words:['does not lie, and we must act accordingly','is overwhelming','cannot be ignored any longer']},
  ],
};

let state = {level:'beginner',drillIdx:0,score:0,streak:0,total:0,correct:0,audioOn:true};
const levels = Object.keys(drills);

// ==================== INIT ====================
function init() {
  const levelBar = document.getElementById('levels');
  levels.forEach((l,i) => {
    const btn = document.createElement('button');
    btn.className = 'lvl' + (l === state.level ? ' active' : '');
    btn.textContent = ['A1 入门','A2 基础','B1 中级','B2/C1 高级'][i];
    btn.onclick = () => switchLevel(l);
    levelBar.appendChild(btn);
  });
  renderDrill();
}
function switchLevel(l) {
  state.level = l; state.drillIdx = 0; state.streak = 0;
  document.querySelectorAll('.lvl').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.lvl')[levels.indexOf(l)].classList.add('active');
  renderDrill();
  updateStats();
}

// ==================== RENDER ====================
function renderDrill() {
  const dl = drills[state.level][state.drillIdx % drills[state.level].length];
  document.getElementById('pattern').innerHTML = dl.pattern;
  document.getElementById('prompt').textContent = dl.prompt;
  const hintEl = document.getElementById('hint');
  if (dl.hint) { hintEl.style.display = 'block'; hintEl.textContent = '💡 Hint: ' + dl.hint; }
  else hintEl.style.display = 'none';
  const inp = document.getElementById('answerInput');
  inp.value = ''; inp.className = ''; inp.focus();
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('btnNext').style.display = 'none';
  document.getElementById('btnCheck').style.display = '';
  document.getElementById('btnCheck').disabled = false;
  animateProgress();
}

function checkAnswer() {
  const inp = document.getElementById('answerInput');
  const userAnswer = inp.value.trim();
  if (!userAnswer) return;
  const dl = drills[state.level][state.drillIdx % drills[state.level].length];
  const expected = dl.answer;

  // Normalize comparison
  const norm = s => s.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
  const isCorrect = norm(userAnswer) === norm(expected);

  state.total++;
  const fb = document.getElementById('feedback');
  if (isCorrect) {
    state.correct++; state.streak++; state.score += 10 + state.streak * 2;
    inp.className = 'correct';
    fb.className = 'feedback show good';
    fb.textContent = `✅ Correct! +${10 + state.streak * 2} points`;
    document.getElementById('btnCheck').style.display = 'none';
    document.getElementById('btnNext').style.display = '';
    document.getElementById('btnNext').focus();
    if (state.audioOn) speak('Good.');
  } else {
    state.streak = 0;
    inp.className = 'wrong';
    fb.className = 'feedback show bad';
    fb.innerHTML = `❌ Not quite.<br>Expected: <strong>${expected}</strong>`;
    // Give another chance
    inp.select();
  }
  updateStats();
  animateProgress();
}

function nextDrill() {
  state.drillIdx++;
  renderDrill();
}

// ==================== SPEECH SYNTHESIS ====================
function speak(text) {
  if (!state.audioOn) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.85;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
function speakPattern() {
  const dl = drills[state.level][state.drillIdx % drills[state.level].length];
  speak(dl.answer);
}

function toggleAudio() {
  state.audioOn = !state.audioOn;
  document.getElementById('audioToggle').textContent = state.audioOn ? '🔊 Audio' : '🔇 Muted';
}

// ==================== STATS ====================
function updateStats() {
  document.getElementById('score').textContent = state.score;
  document.getElementById('streak').textContent = state.streak;
  document.getElementById('acc').textContent = state.total > 0 ? Math.round(state.correct / state.total * 100) + '%' : '0%';
}
function animateProgress() {
  const dl = drills[state.level];
  const pct = ((state.drillIdx % dl.length) / dl.length * 100);
  document.getElementById('progressBar').style.width = pct + '%';
}

// Keyboard shortcut
document.getElementById('answerInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    checkAnswer();
  }
});

init();
</script>
</body>
</html>
