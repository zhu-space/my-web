<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>莫桑</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky-top: #f5efe0;
    --sky-bot: #eedac4;
    --mountain: #d4c5b2;
    --ground: #c9a88c;
    --player: #8b6f5e;
    --glow: #e8b896;
    --sunset: #d4a08a;
    --float: #b8a99a;
    --text: #5c4a3a;
    --progress: #c8a082;
  }

  body {
    font-family: "PingFang SC", "Noto Serif SC", "STSong", "Songti SC", "Microsoft YaHei", serif;
    background: #e8d9c8;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  .game-container {
    position: relative;
    width: 100%;
    max-width: 400px;
    aspect-ratio: 3 / 5;
    background: var(--sky-top);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(139, 111, 94, 0.15);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    pointer-events: none;
    z-index: 2;
    background: rgba(245, 239, 224, 0.75);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: opacity 0.4s;
  }
  .overlay.active { pointer-events: auto; }

  .overlay-title {
    font-size: 34px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.06em;
  }

  .overlay-sub {
    font-size: 14px;
    color: #8b7a62;
    letter-spacing: 0.08em;
  }

  .overlay-score {
    font-size: 56px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }

  .overlay-poem {
    font-size: 16px;
    color: #8b6f5e;
    text-align: center;
    line-height: 1.8;
    letter-spacing: 0.05em;
    max-width: 260px;
  }

  .btn {
    padding: 12px 36px;
    border-radius: 999px;
    border: 1.5px solid var(--ground);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: all 0.25s;
    font-family: inherit;
    background: rgba(255,255,255,0.6);
    color: var(--text);
  }
  .btn:active { transform: scale(0.96); background: var(--ground); }

  .btn-primary {
    background: var(--ground);
    color: #fff;
    border: none;
  }
  .btn-primary:active { background: #b89578; }

  .btn-row { display: flex; gap: 10px; }

  .best-text {
    font-size: 13px;
    color: #8b7a62;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .hidden { display: none !important; }

  .level-up-text {
    font-size: 28px;
    font-weight: 700;
    color: var(--text);
  }
  .level-up-name {
    font-size: 40px;
    font-weight: 700;
    color: var(--sunset);
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>

<div class="game-container" id="gameContainer">
  <canvas id="gameCanvas"></canvas>

  <!-- 开始 -->
  <div class="overlay active" id="startScreen">
    <p class="overlay-title">莫 桑</p>
    <p class="overlay-sub">黄昏山野 · 静心闯关</p>
    <button class="btn btn-primary" id="btnStart">开始游戏</button>
    <p class="best-text" id="bestDisplay"></p>
  </div>

  <!-- 过关 -->
  <div class="overlay hidden" id="levelUpScreen">
    <p class="overlay-sub" id="levelUpLabel">第 1 关 通过</p>
    <p class="level-up-name" id="levelUpName"></p>
  </div>

  <!-- 通关 -->
  <div class="overlay hidden" id="victoryScreen">
    <p class="overlay-sub">恭喜通关</p>
    <p class="overlay-title" style="font-size:24px;">行尽青山，长宁以至</p>
    <p class="overlay-poem" id="victoryPoem"></p>
    <div class="btn-row">
      <button class="btn" id="btnShare">分享成绩</button>
      <button class="btn btn-primary" id="btnReplay">再次出发</button>
    </div>
  </div>

  <!-- 失败 -->
  <div class="overlay hidden" id="endScreen">
    <p class="overlay-sub">止于 第 <span id="endLevel">1</span> 关</p>
    <p class="overlay-score" id="finalScore">0</p>
    <p class="overlay-sub">掠过 <span id="endDodged">0</span> 处风景</p>
    <div class="btn-row" style="margin-top:8px;">
      <button class="btn" id="btnShareEnd">分享成绩</button>
      <button class="btn btn-primary" id="btnRetry">再次出发</button>
    </div>
  </div>
</div>

<script>
(function () {
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const container = document.getElementById("gameContainer");

  // DOM
  const startScreen = document.getElementById("startScreen");
  const levelUpScreen = document.getElementById("levelUpScreen");
  const victoryScreen = document.getElementById("victoryScreen");
  const endScreen = document.getElementById("endScreen");
  const finalScoreEl = document.getElementById("finalScore");
  const endLevelEl = document.getElementById("endLevel");
  const endDodgedEl = document.getElementById("endDodged");
  const bestDisplay = document.getElementById("bestDisplay");
  const victoryPoem = document.getElementById("victoryPoem");
  const levelUpLabel = document.getElementById("levelUpLabel");
  const levelUpName = document.getElementById("levelUpName");

  const W = 400, H = 666;
  const GROUND_Y = H - 80;

  // ---- 关卡配置 ----
  const LEVELS = [
    { n: 1,  name: "初霁",   target: 8,  speed: 280, interval: 1.5, types: ["basic"] },
    { n: 2,  name: "知途",   target: 9,  speed: 300, interval: 1.4, types: ["basic","tall"] },
    { n: 3,  name: "随风",   target: 10, speed: 330, interval: 1.3, types: ["basic","tall","fast"] },
    { n: 4,  name: "安渡",   target: 10, speed: 350, interval: 1.2, types: ["basic","tall","fast","floating"] },
    { n: 5,  name: "观聚散", target: 12, speed: 370, interval: 1.1, types: ["basic","tall","fast","floating","moving"] },
    { n: 6,  name: "执经纬", target: 12, speed: 390, interval: 1.05, types: ["basic","tall","fast","floating","moving","spike"] },
    { n: 7,  name: "晚晴",   target: 13, speed: 420, interval: 0.95, types: ["basic","tall","fast","floating","moving","spike","double"] },
    { n: 8,  name: "归行",   target: 14, speed: 440, interval: 0.9, types: ["basic","tall","fast","floating","moving","spike","double","ghost"] },
    { n: 9,  name: "澄心",   target: 15, speed: 470, interval: 0.85, types: ["basic","tall","fast","floating","moving","spike","double","ghost"] },
    { n: 10, name: "长宁",   target: 20, speed: 500, interval: 0.8, types: ["basic","tall","fast","floating","moving","spike","double","ghost"] },
  ];

  const POEMS = [
    "莫道桑榆晚，为霞尚满天",
    "苔花如米小，也学牡丹开",
    "心有经纬，何惧岁晚",
    "长风破浪会有时，直挂云帆济沧海",
    "千磨万击还坚劲，任尔东西南北风",
    "行到水穷处，坐看云起时",
    "山重水复疑无路，柳暗花明又一村",
    "会当凌绝顶，一览众山小",
    "不畏浮云遮望眼，自缘身在最高层",
    "回首向来萧瑟处，归去，也无风雨也无晴",
  ];

  // ---- 状态 ----
  const STATE = { IDLE: 0, PLAYING: 1, LEVEL_UP: 2, VICTORY: 3, OVER: 4 };
  let state = STATE.IDLE;
  let currentLevel = 0;
  let dodgedInLevel = 0;
  let totalDodged = 0;
  let bestLevel = parseInt(localStorage.getItem("mosangBestLevel") || "0");

  // 玩家
  const PLAYER_W = 30, PLAYER_H = 30;
  let player = { x: 80, y: 0, vy: 0, grounded: true };
  const GRAVITY = 1750;
  const JUMP_VEL = -660;

  // 障碍物 & 环境
  let obstacles = [];
  let particles = [];
  let clouds = [];
  let birds = [];
  let obstacleTimer = 0;
  let speed = 280;
  let obstacleInterval = 1.5;
  let levelUpTimer = 0;
  let time = 0;

  // 山脉轮廓点
  let mountainPoints = [];

  function generateMountains() {
    mountainPoints = [];
    let pts = [{ x: -20, y: GROUND_Y + 20 }];
    for (let x = 0; x <= W + 20; x += 30) {
      let h = 40 + Math.sin(x * 0.008) * 35 + Math.sin(x * 0.019 + 1.3) * 25 + Math.sin(x * 0.003) * 50;
      pts.push({ x, y: GROUND_Y - h });
    }
    pts.push({ x: W + 20, y: GROUND_Y + 20 });
    mountainPoints = pts;
  }

  function initClouds() {
    clouds = [];
    for (let i = 0; i < 5; i++) {
      clouds.push({ x: Math.random() * W, y: 30 + Math.random() * 120, w: 60 + Math.random() * 100, speed: 8 + Math.random() * 15, alpha: 0.25 + Math.random() * 0.25 });
    }
  }

  function initBirds() {
    birds = [];
    for (let i = 0; i < 4; i++) {
      birds.push({ x: Math.random() * W, y: 50 + Math.random() * 100, vx: 20 + Math.random() * 40, wing: Math.random() * Math.PI * 2 });
    }
  }

  function getLevelConfig() {
    return LEVELS[currentLevel];
  }

  // ---- 游戏逻辑 ----
  function reset() {
    player.y = GROUND_Y - PLAYER_H;
    player.vy = 0;
    player.grounded = true;
    obstacles = [];
    particles = [];
    obstacleTimer = 0;
    currentLevel = 0;
    dodgedInLevel = 0;
    totalDodged = 0;
    const cfg = getLevelConfig();
    speed = cfg.speed;
    obstacleInterval = cfg.interval;
    levelUpTimer = 0;
  }

  function jump() {
    if (!player.grounded) return;
    player.vy = JUMP_VEL;
    player.grounded = false;
  }

  function spawnObstacle() {
    const cfg = getLevelConfig();
    const types = cfg.types;
    const type = types[Math.floor(Math.random() * types.length)];
    const base = { x: W + 20, scored: false, type };

    switch (type) {
      case "basic":
        base.h = 28 + Math.random() * 36;
        base.w = 20 + Math.random() * 14;
        base.y = GROUND_Y - base.h;
        break;
      case "tall":
        base.h = 55 + Math.random() * 30;
        base.w = 16 + Math.random() * 10;
        base.y = GROUND_Y - base.h;
        break;
      case "fast":
        base.h = 18 + Math.random() * 20;
        base.w = 14 + Math.random() * 8;
        base.y = GROUND_Y - base.h;
        base.speedMul = 1.3;
        break;
      case "floating":
        base.w = 26 + Math.random() * 16;
        base.h = 10 + Math.random() * 10;
        // 浮在跳跃轨迹中间 —— 玩家需要蹲（不跳）来躲避
        base.y = GROUND_Y - 70 - Math.random() * 40;
        break;
      case "moving":
        base.w = 18 + Math.random() * 10;
        base.h = 34 + Math.random() * 28;
        base.y = GROUND_Y - base.h;
        base.baseY = base.y;
        base.moveAmp = 30 + Math.random() * 50;
        base.moveFreq = 1.8 + Math.random() * 2.5;
        base.movePhase = Math.random() * Math.PI * 2;
        break;
      case "spike":
        base.w = 12;
        base.h = 55 + Math.random() * 25;
        base.y = GROUND_Y - base.h;
        break;
      case "double":
        base.h = 22 + Math.random() * 18;
        base.w = 16 + Math.random() * 8;
        base.y = GROUND_Y - base.h;
        base.gap = 36 + Math.random() * 20;
        break;
      case "ghost":
        base.h = 30 + Math.random() * 34;
        base.w = 20 + Math.random() * 14;
        base.y = GROUND_Y - base.h;
        base.ghostAlpha = 1;
        base.ghostDir = -1;
        break;
    }
    obstacles.push(base);
  }

  function spawnPetals(x, y, count) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 80,
        vy: (Math.random() - 0.8) * 140,
        life: 0.6 + Math.random() * 0.6,
        maxLife: 0.6 + Math.random() * 0.6,
        r: 1.5 + Math.random() * 3,
        color: Math.random() > 0.5 ? "#e8b896" : "#d4a08a",
      });
    }
  }

  function update(dt) {
    if (state === STATE.IDLE || state === STATE.VICTORY || state === STATE.OVER) return;

    const capped = Math.min(dt, 0.05);
    time += capped;

    if (state === STATE.LEVEL_UP) {
      levelUpTimer -= capped;
      if (levelUpTimer <= 0) {
        currentLevel++;
        if (currentLevel >= LEVELS.length) {
          completeGame();
          return;
        }
        dodgedInLevel = 0;
        obstacles = [];
        obstacleTimer = 0;
        const cfg = getLevelConfig();
        speed = cfg.speed;
        obstacleInterval = cfg.interval;
        levelUpScreen.classList.add("hidden");
        levelUpScreen.classList.remove("active");
        state = STATE.PLAYING;
        player.y = GROUND_Y - PLAYER_H;
        player.vy = 0;
        player.grounded = true;
      }
      // 过关期间仍然更新粒子
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= capped;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        p.x += p.vx * capped;
        p.y += p.vy * capped;
        p.vy += 300 * capped;
      }
      return;
    }

    // 玩家物理
    player.vy += GRAVITY * capped;
    player.y += player.vy * capped;
    if (player.y >= GROUND_Y - PLAYER_H) {
      player.y = GROUND_Y - PLAYER_H;
      player.vy = 0;
      player.grounded = true;
    }

    // 障碍物生成
    obstacleTimer += capped;
    if (obstacleTimer >= obstacleInterval) {
      obstacleTimer = 0;
      spawnObstacle();
    }

    // 障碍物更新
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const obs = obstacles[i];
      const mul = obs.speedMul || 1;
      obs.x -= speed * mul * capped;

      // moving 浮动
      if (obs.type === "moving") {
        obs.movePhase += obs.moveFreq * capped;
        obs.y = obs.baseY + Math.sin(obs.movePhase) * obs.moveAmp;
      }

      // ghost 闪烁
      if (obs.type === "ghost") {
        obs.ghostAlpha += obs.ghostDir * 2.5 * capped;
        if (obs.ghostAlpha <= 0.15) { obs.ghostAlpha = 0.15; obs.ghostDir = 1; }
        if (obs.ghostAlpha >= 1) { obs.ghostAlpha = 1; obs.ghostDir = -1; }
      }

      // 碰撞检测
      const px = player.x + 5, py = player.y + 4, pw = PLAYER_W - 10, ph = PLAYER_H - 8;
      if (obs.type === "double") {
        const gap = obs.gap || 40;
        const hw = obs.w;
        // 第一个块
        const o1x = obs.x, o1y = obs.y, o1w = hw, o1h = obs.h;
        if (px < o1x + o1w && px + pw > o1x && py < o1y + o1h && py + ph > o1y) { endGame(); return; }
        // 第二个块
        const o2x = obs.x + hw + gap, o2y = obs.y;
        if (px < o2x + o1w && px + pw > o2x && py < o2y + o1h && py + ph > o2y) { endGame(); return; }
      } else {
        const ox = obs.x + 2, oy = obs.y + 2, ow = obs.w - 4, oh = obs.h - 4;
        if (px < ox + ow && px + pw > ox && py < oy + oh && py + ph > oy) { endGame(); return; }
      }

      // 计分（double 以第二个块位置为计分点）
      const scoreX = obs.type === "double" ? obs.x + obs.w + (obs.gap || 40) + obs.w : obs.x + obs.w;
      if (!obs.scored && scoreX < player.x) {
        obs.scored = true;
        dodgedInLevel++;
        totalDodged++;
        const cfg = getLevelConfig();
        if (dodgedInLevel >= cfg.target) {
          levelUp();
        }
      }

      // 移除
      if (obs.x < -80) obstacles.splice(i, 1);
    }

    // 云
    for (const c of clouds) {
      c.x -= c.speed * capped;
      if (c.x < -c.w) c.x = W + c.w;
    }

    // 鸟
    for (const b of birds) {
      b.x += b.vx * capped;
      b.wing += capped * 3;
      if (b.x > W + 30) b.x = -30;
    }

    // 粒子
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= capped;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * capped;
      p.y += p.vy * capped;
      p.vy += 300 * capped;
    }
  }

  function levelUp() {
    state = STATE.LEVEL_UP;
    levelUpTimer = 1.8;
    const cfg = getLevelConfig();
    levelUpLabel.textContent = `第 ${cfg.n} 关 通过`;
    levelUpName.textContent = cfg.name;
    levelUpScreen.classList.remove("hidden");
    levelUpScreen.classList.add("active");
    spawnPetals(player.x + PLAYER_W / 2, player.y, 16);
  }

  function completeGame() {
    state = STATE.VICTORY;
    if (currentLevel + 1 > bestLevel) {
      bestLevel = currentLevel + 1;
      localStorage.setItem("mosangBestLevel", bestLevel);
    }
    const poem = POEMS[Math.floor(Math.random() * POEMS.length)];
    victoryPoem.textContent = poem;
    victoryScreen.classList.remove("hidden");
    victoryScreen.classList.add("active");
    spawnPetals(W / 2, H / 2, 40);
  }

  function endGame() {
    state = STATE.OVER;
    spawnPetals(player.x + PLAYER_W / 2, player.y, 12);
    const reachedLevel = currentLevel + 1;
    if (reachedLevel > bestLevel) {
      bestLevel = reachedLevel;
      localStorage.setItem("mosangBestLevel", bestLevel);
    }
    finalScoreEl.textContent = totalDodged;
    endLevelEl.textContent = reachedLevel;
    endDodgedEl.textContent = totalDodged;
    endScreen.classList.remove("hidden");
    endScreen.classList.add("active");
  }

  // ---- 渲染 ----
  function drawSky(ctx) {
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#f5efe0");
    bg.addColorStop(0.5, "#f0e4d0");
    bg.addColorStop(1, "#eedac4");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // 柔光
    const sun = ctx.createRadialGradient(W * 0.7, H * 0.25, 20, W * 0.7, H * 0.25, 200);
    sun.addColorStop(0, "rgba(255,242,230,0.5)");
    sun.addColorStop(1, "rgba(255,242,230,0)");
    ctx.fillStyle = sun;
    ctx.fillRect(0, 0, W, H);
  }

  function drawClouds(ctx) {
    for (const c of clouds) {
      ctx.fillStyle = `rgba(255,252,248,${c.alpha})`;
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, c.w * 0.5, c.w * 0.18, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(c.x - c.w * 0.2, c.y - c.w * 0.06, c.w * 0.3, c.w * 0.13, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(c.x + c.w * 0.25, c.y - c.w * 0.04, c.w * 0.28, c.w * 0.12, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawBirds(ctx) {
    for (const b of birds) {
      const wy = Math.sin(b.wing) * 6;
      ctx.strokeStyle = "#c4b5a0";
      ctx.lineWidth = 1.2;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(b.x - 8, b.y - wy);
      ctx.quadraticCurveTo(b.x - 4, b.y - 3 - wy, b.x, b.y - wy);
      ctx.quadraticCurveTo(b.x + 4, b.y - 3 - wy, b.x + 8, b.y - wy);
      ctx.stroke();
    }
  }

  function drawMountains(ctx) {
    if (mountainPoints.length === 0) generateMountains();
    ctx.fillStyle = "#e2d2bd";
    ctx.beginPath();
    ctx.moveTo(mountainPoints[0].x, mountainPoints[0].y);
    for (let i = 1; i < mountainPoints.length; i++) {
      ctx.lineTo(mountainPoints[i].x, mountainPoints[i].y);
    }
    ctx.lineTo(W + 20, GROUND_Y + 20);
    ctx.lineTo(-20, GROUND_Y + 20);
    ctx.closePath();
    ctx.fill();

    // 第二层远山（更淡）
    ctx.fillStyle = "#eaddcb";
    ctx.beginPath();
    ctx.moveTo(-20, GROUND_Y + 20);
    for (let x = -20; x <= W + 20; x += 25) {
      let h = 25 + Math.sin(x * 0.012 + 0.7) * 20 + Math.sin(x * 0.025) * 15;
      ctx.lineTo(x, GROUND_Y - h);
    }
    ctx.lineTo(W + 20, GROUND_Y + 20);
    ctx.closePath();
    ctx.fill();
  }

  function drawGround(ctx) {
    ctx.fillStyle = "#c9a88c";
    ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

    // 草地纹理
    ctx.fillStyle = "#bfa07a";
    ctx.fillRect(0, GROUND_Y, W, 4);

    // 接地虚线
    ctx.strokeStyle = "rgba(139,111,94,0.3)";
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 12]);
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y + 10);
    ctx.lineTo(W, GROUND_Y + 10);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawPlayer(ctx) {
    const x = player.x, y = player.y;

    // 光晕
    const glow = ctx.createRadialGradient(x + PLAYER_W/2, y + PLAYER_H/2, 4, x + PLAYER_W/2, y + PLAYER_H/2, 30);
    glow.addColorStop(0, "rgba(232,184,150,0.35)");
    glow.addColorStop(1, "rgba(232,184,150,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(x - 12, y - 12, PLAYER_W + 24, PLAYER_H + 24);

    // 身体
    ctx.fillStyle = "#8b6f5e";
    ctx.beginPath();
    ctx.roundRect(x, y, PLAYER_W, PLAYER_H, 8);
    ctx.fill();

    // 高光
    ctx.fillStyle = "rgba(255,248,240,0.25)";
    ctx.beginPath();
    ctx.roundRect(x + 4, y + 3, 10, 8, 4);
    ctx.fill();

    // 眼睛
    ctx.fillStyle = "#fffef9";
    ctx.beginPath();
    ctx.arc(x + 20, y + 13, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#3a2a1a";
    ctx.beginPath();
    ctx.arc(x + 21, y + 12, 2.2, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawObstacles(ctx) {
    for (const obs of obstacles) {
      const alpha = obs.type === "ghost" ? obs.ghostAlpha || 1 : 1;
      ctx.globalAlpha = alpha;

      if (obs.type === "double") {
        const gap = obs.gap || 40;
        // 第一个
        drawStone(ctx, obs.x, obs.y, obs.w, obs.h, "#d4a08a");
        // 第二个
        drawStone(ctx, obs.x + obs.w + gap, obs.y, obs.w, obs.h, "#d4a08a");
      } else {
        switch (obs.type) {
          case "basic":
            drawStone(ctx, obs.x, obs.y, obs.w, obs.h, "#c9a88c");
            break;
          case "tall":
            drawShrub(ctx, obs.x, obs.y, obs.w, obs.h);
            break;
          case "fast":
            drawCritter(ctx, obs.x, obs.y, obs.w, obs.h);
            break;
          case "floating":
            drawLeafCluster(ctx, obs.x, obs.y, obs.w, obs.h);
            break;
          case "moving":
            drawBamboo(ctx, obs.x, obs.y, obs.w, obs.h);
            break;
          case "spike":
            drawSpike(ctx, obs.x, obs.y, obs.w, obs.h);
            break;
          case "ghost":
            drawMist(ctx, obs.x, obs.y, obs.w, obs.h);
            break;
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawStone(ctx, x, y, w, h, color) {
    // 光晕
    ctx.fillStyle = color.replace(")", ",0.18)").replace("rgb", "rgba");
    if (color.startsWith("#")) {
      ctx.fillStyle = "rgba(201,168,140,0.15)";
    }
    ctx.beginPath();
    ctx.ellipse(x + w/2, y + h/2, w*0.7, h*0.7, 0, 0, Math.PI*2);
    ctx.fill();

    // 石体
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(x, y + 4, w, h - 4, w*0.5);
    ctx.fill();

    // 高光
    ctx.fillStyle = "rgba(255,248,240,0.2)";
    ctx.beginPath();
    ctx.arc(x + w*0.35, y + h*0.35, w*0.2, 0, Math.PI*2);
    ctx.fill();
  }

  function drawShrub(ctx, x, y, w, h) {
    ctx.fillStyle = "#8b7a62";
    // 主干
    ctx.fillRect(x + w*0.4, y + h*0.3, w*0.2, h*0.7);
    // 树冠
    ctx.beginPath();
    ctx.arc(x + w/2, y + h*0.25, w*0.7, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + w*0.25, y + h*0.35, w*0.45, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + w*0.75, y + h*0.3, w*0.5, 0, Math.PI*2);
    ctx.fill();
    // 高光
    ctx.fillStyle = "rgba(255,248,240,0.12)";
    ctx.beginPath();
    ctx.arc(x + w*0.4, y + h*0.2, w*0.35, 0, Math.PI*2);
    ctx.fill();
  }

  function drawCritter(ctx, x, y, w, h) {
    // 小动物剪影
    ctx.fillStyle = "#e8b896";
    ctx.beginPath();
    ctx.ellipse(x + w*0.6, y + h*0.5, w*0.5, h*0.4, 0, 0, Math.PI*2);
    ctx.fill();
    // 耳朵/触角
    ctx.beginPath();
    ctx.arc(x + w*0.7, y + h*0.15, w*0.2, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + w*0.45, y + h*0.2, w*0.18, 0, Math.PI*2);
    ctx.fill();
    // 尾巴
    ctx.strokeStyle = "#e8b896";
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(x + w*0.25, y + h*0.5);
    ctx.quadraticCurveTo(x - w*0.2, y + h*0.3, x - w*0.1, y + h*0.6);
    ctx.stroke();
  }

  function drawLeafCluster(ctx, x, y, w, h) {
    // 浮空落叶团
    for (let i = 0; i < 5; i++) {
      const lx = x + Math.cos(i * 1.3 + time * 2) * w*0.4;
      const ly = y + Math.sin(i * 0.9 + time * 1.5) * h*0.5;
      ctx.fillStyle = i % 2 === 0 ? "#b8a99a" : "#c9a88c";
      ctx.beginPath();
      ctx.ellipse(lx, ly, 6, 3, 0.3, 0, Math.PI*2);
      ctx.fill();
    }
    // 中心
    ctx.fillStyle = "rgba(184,169,154,0.6)";
    ctx.beginPath();
    ctx.arc(x + w/2, y + h/2, w*0.3, 0, Math.PI*2);
    ctx.fill();
  }

  function drawBamboo(ctx, x, y, w, h) {
    // 竹枝
    ctx.fillStyle = "#8b6f5e";
    ctx.fillRect(x + w*0.4, y, w*0.2, h);
    // 竹节
    for (let jy = y + h*0.15; jy < y + h; jy += h*0.2) {
      ctx.fillStyle = "#7a5f4e";
      ctx.fillRect(x + w*0.3, jy, w*0.4, 2);
      ctx.fillStyle = "#8b6f5e";
    }
    // 叶子
    ctx.fillStyle = "#9b8a72";
    ctx.beginPath();
    ctx.ellipse(x + w*0.6, y + h*0.2, w*0.5, w*0.12, 0.5, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x + w*0.2, y + h*0.5, w*0.4, w*0.1, -0.3, 0, Math.PI*2);
    ctx.fill();
  }

  function drawSpike(ctx, x, y, w, h) {
    // 尖石笋
    ctx.fillStyle = "#a0846c";
    ctx.beginPath();
    ctx.moveTo(x, y + h);
    ctx.lineTo(x + w/2, y);
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "rgba(255,248,240,0.15)";
    ctx.beginPath();
    ctx.moveTo(x + w*0.2, y + h);
    ctx.lineTo(x + w/2, y + h*0.15);
    ctx.lineTo(x + w*0.5, y + h);
    ctx.closePath();
    ctx.fill();
  }

  function drawMist(ctx, x, y, w, h) {
    // 薄雾气团
    const cx = x + w/2, cy = y + h/2;
    ctx.fillStyle = "rgba(245,239,224,0.5)";
    ctx.beginPath();
    ctx.ellipse(cx, cy, w*0.6, h*0.5, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx - w*0.2, cy - h*0.15, w*0.4, h*0.35, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + w*0.25, cy + h*0.1, w*0.35, h*0.3, 0, 0, Math.PI*2);
    ctx.fill();
  }

  function drawParticles(ctx) {
    for (const p of particles) {
      const alpha = p.life / p.maxLife;
      ctx.fillStyle = p.color;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.r * alpha, p.r * 0.5 * alpha, Math.random(), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD(ctx) {
    if (state !== STATE.PLAYING && state !== STATE.LEVEL_UP) return;
    const cfg = getLevelConfig();
    const lvl = cfg.n;

    // 关卡标签
    ctx.fillStyle = "#5c4a3a";
    ctx.font = "14px 'PingFang SC','Microsoft YaHei',serif";
    ctx.textAlign = "left";
    ctx.fillText(`第 ${lvl}/10 关 · ${cfg.name}`, 18, 34);

    // 进度条
    const barX = 18, barY = 44, barW = W - 36, barH = 4;
    ctx.fillStyle = "rgba(201,168,140,0.25)";
    ctx.beginPath();
    ctx.roundRect(barX, barY, barW, barH, 2);
    ctx.fill();

    const pct = Math.min(dodgedInLevel / cfg.target, 1);
    ctx.fillStyle = "#c8a082";
    ctx.beginPath();
    ctx.roundRect(barX, barY, barW * pct, barH, 2);
    ctx.fill();

    // 进度文字
    ctx.fillStyle = "#8b7a62";
    ctx.font = "11px 'PingFang SC','Microsoft YaHei',serif";
    ctx.textAlign = "right";
    ctx.fillText(`${dodgedInLevel}/${cfg.target}`, W - 18, barY - 4);
    ctx.textAlign = "left";
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawSky(ctx);
    drawClouds(ctx);
    drawBirds(ctx);
    drawMountains(ctx);
    drawGround(ctx);
    drawObstacles(ctx);
    drawPlayer(ctx);
    drawParticles(ctx);
    drawHUD(ctx);
  }

  let lastTime = 0;
  let animId;

  function loop(ts) {
    const dt = lastTime ? (ts - lastTime) / 1000 : 0;
    lastTime = ts;
    update(dt);
    render();
    animId = requestAnimationFrame(loop);
  }

  // ---- 输入 ----
  function handleInput(e) {
    e.preventDefault();
    if (state === STATE.IDLE) startGame();
    else if (state === STATE.PLAYING) jump();
  }

  canvas.addEventListener("pointerdown", handleInput);
  canvas.addEventListener("touchstart", handleInput, { passive: false });
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp") {
      e.preventDefault();
      if (state === STATE.IDLE) startGame();
      else if (state === STATE.PLAYING) jump();
    }
  });

  function startGame() {
    reset();
    state = STATE.PLAYING;
    [
      startScreen, endScreen, victoryScreen, levelUpScreen,
    ].forEach(el => { el.classList.add("hidden"); el.classList.remove("active"); });
  }

  document.getElementById("btnStart").addEventListener("click", (e) => { e.stopPropagation(); startGame(); });
  document.getElementById("btnRetry").addEventListener("click", (e) => { e.stopPropagation(); startGame(); });
  document.getElementById("btnReplay").addEventListener("click", (e) => { e.stopPropagation(); startGame(); });

  function doShare() {
    const reachedLevel = state === STATE.VICTORY ? 10 : (currentLevel + 1);
    const extra = state === STATE.VICTORY ? `「${victoryPoem.textContent}」` : "";
    const text = `🏔️ 我在「莫桑」走到了第 ${reachedLevel} 关，共掠过 ${totalDodged} 处风景。${extra} 来山野间走一走吧！`;
    if (navigator.share) {
      navigator.share({ title: "莫桑", text, url: location.href });
    } else {
      navigator.clipboard.writeText(text + " " + location.href).then(() => {
        alert("分享文案已复制，粘贴到朋友圈即可！");
      }).catch(() => {
        prompt("复制这段分享到朋友圈吧：", text + " " + location.href);
      });
    }
  }

  document.getElementById("btnShare").addEventListener("click", (e) => { e.stopPropagation(); doShare(); });
  document.getElementById("btnShareEnd").addEventListener("click", (e) => { e.stopPropagation(); doShare(); });

  // ---- 初始化 ----
  function resize() {
    canvas.width = W;
    canvas.height = H;
  }
  resize();
  window.addEventListener("resize", resize);
  generateMountains();
  initClouds();
  initBirds();
  if (bestLevel > 0) {
    bestDisplay.textContent = `曾至 第 ${bestLevel} 关`;
  } else {
    bestDisplay.textContent = "黄昏山野 · 静心闯关";
  }
  player.y = GROUND_Y - PLAYER_H;
  lastTime = performance.now();
  animId = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
