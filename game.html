<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>甲申 · Jiashen 1644</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&display=swap');
:root{--paper:#d4c8b0;--fade:#9a8b72;--gold:#b8943e;--red:#7a2014;--ink:#1a1410}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0806;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;
  font-family:'Noto Serif SC','SimSun','KaiTi',serif;user-select:none;-webkit-user-select:none}
#game{position:relative;width:100vw;height:100vh;max-width:960px;max-height:640px;overflow:hidden}
canvas{display:block;position:absolute;top:0;left:0;width:100%;height:100%}
#ui{position:absolute;inset:0;pointer-events:none;z-index:10}
#ui>*{pointer-events:auto}

#dlg{position:absolute;bottom:0;left:0;right:0;padding:50px 32px 28px;
  background:linear-gradient(transparent 0%,rgba(10,8,6,0.7) 25%,rgba(10,8,6,0.94) 100%);display:none;cursor:pointer}
#dlg.on{display:block}
#dlg .s{font-size:0.68rem;color:var(--gold);margin-bottom:5px;letter-spacing:3px;font-weight:400}
#dlg .t{font-size:1.05rem;color:var(--paper);line-height:2;letter-spacing:1.5px;font-weight:300}
#dlg .h{text-align:right;font-size:0.6rem;color:var(--fade);margin-top:8px;animation:blink 2.2s infinite;letter-spacing:2px}
@keyframes blink{0%,100%{opacity:0.35}50%{opacity:1}}

#choices{position:absolute;bottom:0;left:0;right:0;padding:36px 32px 32px;display:none;
  background:linear-gradient(transparent,rgba(10,8,6,0.92) 15%)}
#choices.on{display:flex;flex-direction:column;gap:10px}
.ch{background:rgba(24,20,14,0.88);border:1px solid rgba(184,148,62,0.25);color:var(--paper);
  padding:15px 22px;font-family:inherit;font-size:0.92rem;cursor:pointer;text-align:left;letter-spacing:2px;
  transition:all 0.25s;border-radius:2px;font-weight:300}
.ch:hover{background:rgba(32,26,16,0.9);border-color:var(--gold);padding-left:30px}

#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center 45%,rgba(24,18,10,0.2),rgba(4,3,2,0.95));cursor:pointer}
#title h1{font-size:3.5rem;color:var(--paper);letter-spacing:12px;font-weight:300;margin-bottom:6px}
#title .sub{font-size:0.72rem;color:var(--fade);letter-spacing:6px;margin-bottom:48px;font-weight:300}
#title .sh{font-size:0.65rem;color:var(--gold);animation:blink 2.2s infinite;letter-spacing:4px;font-weight:300}
#lineSel{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(6,5,4,0.94);gap:14px}
#lineSel.on{display:flex}
.lb{background:transparent;border:1px solid rgba(184,148,62,0.25);color:var(--paper);padding:22px 44px;
  font-family:inherit;font-size:1.05rem;cursor:pointer;letter-spacing:4px;width:260px;text-align:center;
  transition:all 0.3s;font-weight:300}
.lb:hover{background:rgba(30,24,14,0.5);border-color:var(--gold)}
.lb .ll{font-size:0.55rem;color:var(--fade);margin-bottom:5px;letter-spacing:3px}
#ep{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(6,5,4,0.96);flex-direction:column}
#ep.on{display:flex}
#ep .en{font-size:0.65rem;color:var(--gold);letter-spacing:4px}
#ep .em{font-size:1.6rem;color:var(--paper);margin-top:8px;letter-spacing:6px;font-weight:300}
#ep .el{font-size:0.7rem;color:var(--fade);margin-top:6px;letter-spacing:3px}
#soundBtn{position:absolute;top:14px;right:18px;z-index:99;background:rgba(6,5,4,0.5);
  border:1px solid rgba(255,255,255,0.15);color:var(--fade);width:32px;height:32px;border-radius:50%;
  cursor:pointer;font-size:0.85rem;display:flex;align-items:center;justify-content:center;transition:all 0.3s}
#soundBtn:hover{border-color:var(--gold);color:var(--gold)}
</style>
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>
  <div id="ui">
    <button id="soundBtn" onclick="toggleSound()" title="Toggle sound">🔊</button>
    <div id="title"><h1>甲 申</h1><div class="sub">J I A S H E N · 1 6 4 4</div><div class="sh">点 击 开 始</div></div>
    <div id="lineSel">
      <button class="lb" onclick="startGame('A')"><div class="ll">第 一 线</div>士 · 国子监生</button>
      <button class="lb" onclick="startGame('B')"><div class="ll">第 二 线</div>海 · 走私船主</button>
      <button class="lb" onclick="startGame('C')"><div class="ll">第 三 线</div>隐 · 汉人旗兵</button>
    </div>
    <div id="ep"><div class="en"></div><div class="em"></div><div class="el"></div></div>
    <div id="dlg"><div class="s"></div><div class="t"></div><div class="h">点 击 继 续</div></div>
    <div id="choices"></div>
  </div>
</div>

<script>
// ==================== AUDIO ENGINE ====================
let audioCtx=null,soundOn=true;
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx}
function toggleSound(){soundOn=!soundOn;document.getElementById('soundBtn').textContent=soundOn?'🔊':'🔇';
  if(!soundOn&&audioCtx)audioCtx.suspend();else if(soundOn&&audioCtx)audioCtx.resume()}
function noise(dur){const c=getAudio();if(c.state==='suspended')c.resume();const b=c.createBuffer(1,c.sampleRate*dur,c.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1);return b}
let curAmb=null;
function setAmbient(type){
  if(curAmb)curAmb.stop();if(!soundOn||!type){curAmb=null;return}
  const c=getAudio();if(c.state==='suspended')c.resume();
  const g=c.createGain();g.gain.value=0;g.connect(c.destination);
  let src,stops=[];
  if(type==='wind'){
    src=c.createBufferSource();src.buffer=noise(3);src.loop=true;
    const b=c.createBiquadFilter();b.type='bandpass';b.frequency.value=180;b.Q.value=0.3;
    src.connect(b);b.connect(g);g.gain.linearRampToValueAtTime(0.12,c.currentTime+0.5);src.start();stops.push(()=>{src.stop();g.gain.linearRampToValueAtTime(0,c.currentTime+0.6)});
  }else if(type==='rain'){
    src=c.createBufferSource();const buf=noise(4);const bufData=buf.getChannelData(0);for(let i=0;i<bufData.length;i++)bufData[i]=Math.random()>0.65?bufData[i]*0.08:bufData[i]*0.02;src.buffer=buf;src.loop=true;
    const b=c.createBiquadFilter();b.type='highpass';b.frequency.value=600;src.connect(b);b.connect(g);g.gain.linearRampToValueAtTime(0.1,c.currentTime+0.4);src.start();stops.push(()=>{src.stop();g.gain.linearRampToValueAtTime(0,c.currentTime+0.3)});
  }else if(type==='fire'){
    src=c.createBufferSource();const buf=noise(3);const bufData=buf.getChannelData(0);for(let i=0;i<bufData.length;i++){if(Math.random()>0.82)bufData[i]=(Math.random()*2-1)*0.1;else bufData[i]=bufData[Math.max(0,i-1)]*0.6}src.buffer=buf;src.loop=true;
    const b=c.createBiquadFilter();b.type='bandpass';b.frequency.value=350;b.Q.value=0.8;src.connect(b);b.connect(g);g.gain.linearRampToValueAtTime(0.07,c.currentTime+0.5);src.start();stops.push(()=>{src.stop();g.gain.linearRampToValueAtTime(0,c.currentTime+0.5)});
  }else if(type==='waves'){
    const o1=c.createOscillator();o1.type='sine';o1.frequency.value=0.06;const g1=c.createGain();g1.gain.value=0.015;o1.connect(g1);g1.connect(g);
    const o2=c.createOscillator();o2.type='triangle';o2.frequency.value=0.1;const g2=c.createGain();g2.gain.value=0.01;o2.connect(g2);g2.connect(g);
    o1.start();o2.start();g.gain.linearRampToValueAtTime(0.05,c.currentTime+0.8);stops.push(()=>{o1.stop();o2.stop();g.gain.linearRampToValueAtTime(0,c.currentTime+0.5)});
  }else if(type==='bell'){
    const o=c.createOscillator();o.type='sine';o.frequency.value=523;const gg=c.createGain();gg.gain.value=0.08;gg.gain.exponentialRampToValueAtTime(0.001,c.currentTime+2);o.connect(gg);gg.connect(g);o.start();o.stop(c.currentTime+2.2);g.gain.value=0.06;stops.push(()=>{o.stop();g.gain.linearRampToValueAtTime(0,c.currentTime+0.3)});
  }
  curAmb={stop:()=>{stops.forEach(s=>s());setTimeout(()=>g.disconnect(),800)}};
}

// ==================== GAME STATE ====================
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const dlg=document.getElementById('dlg'),dlgS=dlg.querySelector('.s'),dlgT=dlg.querySelector('.t');
const chEl=document.getElementById('choices'),titleEl=document.getElementById('title'),lineSel=document.getElementById('lineSel'),epEl=document.getElementById('ep');
let game={line:null,cs:null},world=loadW();let sIdx=0,di=0,playing=false,rf=null,time=0;

function resize(){cv.width=cv.parentElement.clientWidth;cv.height=cv.parentElement.clientHeight}
window.addEventListener('resize',resize);resize();
function loadW(){try{return JSON.parse(localStorage.getItem('js2'))||{}}catch(e){return{}}}
function saveW(){try{localStorage.setItem('js2',JSON.stringify(world))}catch(e){}}
function setW(k,v){world[k]=v;saveW()}

// ==================== INK WASH RENDERER ====================
const {PI,sin,cos,random,abs,floor,sqrt,atan2}=Math;
function ink(r,g,b,a){return `rgba(${r},${g},${b},${a||1})`}
function wash(r,g,b,a){return `rgba(${r},${g},${b},${a||0.15})`}

// Mountain range with ink-wash layering
function inkMountains(yBase,heightVar,layers,colorR,colorG,colorB,wVal){
  const w=cv.width,h=cv.height;
  for(let l=0;l<layers;l++){
    const alpha=0.12+l*0.06, y=yBase+l*heightVar*0.3;
    ctx.fillStyle=ink(colorR,colorG,colorB,alpha*0.7);
    ctx.beginPath();ctx.moveTo(0,h);
    for(let x=0;x<=w;x+=8){
      const ny=y+sin(x*0.005+l*1.3)*heightVar*0.7+sin(x*0.013+l*2.1)*heightVar*0.35+sin(x*0.002+l*0.6)*heightVar*0.2;
      ctx.lineTo(x,ny);
    }
    ctx.lineTo(w,h);ctx.fill();
  }
}

// Mist/cloud band
function mistBand(y,height,alpha,speed){
  const w=cv.width;
  ctx.fillStyle=ink(180,170,150,alpha*0.08);
  ctx.beginPath();ctx.moveTo(0,y);const offset=time*speed*0.1;
  for(let x=0;x<=w;x+=20)ctx.lineTo(x,y+sin(x*0.008+offset)*height*0.5+sin(x*0.02-offset*0.7)*height*0.3);
  ctx.lineTo(w,y+height);ctx.lineTo(0,y+height);ctx.fill();
}

// Roof with curved eaves (Chinese style)
function chineseRoof(cx,cy,width,rise,color){
  ctx.fillStyle=color;ctx.strokeStyle=color;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(cx-width/2,cy);
  ctx.quadraticCurveTo(cx-width/2+10,cy-rise,cx,cy-rise-2);
  ctx.quadraticCurveTo(cx+width/2-10,cy-rise,cx+width/2,cy);
  ctx.lineTo(cx+width/2-2,cy+3);ctx.quadraticCurveTo(cx,cy-rise+4,cx-width/2+2,cy+3);ctx.fill();
}

// Lantern
function lantern(x,y,s,glow){
  if(glow){ctx.fillStyle=ink(200,120,40,0.2);ctx.beginPath();ctx.arc(x+s/2,y-s*0.4,s*2.5,0,PI*2);ctx.fill()}
  ctx.fillStyle=ink(160,40,30,0.85);ctx.beginPath();ctx.ellipse(x+s/2,y,s*0.7,s*1.2,0,0,PI*2);ctx.fill();
  ctx.fillStyle=ink(60,20,10,0.9);ctx.fillRect(x+s/2-2,y-s*1.4,4,3);
}

// Tree (ink brush style)
function inkTree(x,y,h,spread){
  ctx.strokeStyle=ink(8,5,3,0.5);ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-h);
  ctx.stroke();
  for(let i=0;i<4;i++){
    const bx=x+sin(i*1.5)*spread*0.4,by=y-h*0.35-i*h*0.15;
    ctx.beginPath();ctx.moveTo(x,by);ctx.quadraticCurveTo(bx,by-h*0.2,bx+spread*0.6,by-h*0.3);ctx.stroke();
  }
  // Foliage dots
  for(let i=0;i<12;i++){ctx.fillStyle=ink(6,4,2,0.3+random()*0.2);ctx.beginPath();ctx.arc(x-h*0.2+random()*h*0.5,y-h*0.4-random()*h*0.6,2+random()*3,0,PI*2);ctx.fill()}
}

// CHARACTER: detailed scholar
function drawScholar(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.globalAlpha=0.9;
  // Bottom robe - flowing lines
  ctx.fillStyle=ink(12,10,8,0.85);
  ctx.beginPath();ctx.moveTo(-18,22);ctx.quadraticCurveTo(-22,16,-14,14);ctx.quadraticCurveTo(0,10,14,14);ctx.quadraticCurveTo(22,16,18,22);
  ctx.quadraticCurveTo(16,58,0,64);ctx.quadraticCurveTo(-16,58,-18,22);ctx.fill();
  // Inner robe highlight
  ctx.fillStyle=ink(18,15,13,0.5);ctx.beginPath();ctx.moveTo(-10,22);ctx.quadraticCurveTo(-8,40,0,42);ctx.quadraticCurveTo(8,40,10,22);ctx.fill();
  // Left sleeve
  ctx.fillStyle=ink(10,8,6,0.8);ctx.beginPath();ctx.moveTo(-22,18);ctx.quadraticCurveTo(-36,20,-38,28);ctx.quadraticCurveTo(-36,32,-24,26);ctx.closePath();ctx.fill();
  // Right sleeve
  ctx.fillStyle=ink(10,8,6,0.8);ctx.beginPath();ctx.moveTo(22,18);ctx.quadraticCurveTo(36,20,38,28);ctx.quadraticCurveTo(36,32,24,26);ctx.closePath();ctx.fill();
  // Hand visible
  ctx.fillStyle=ink(30,24,18,0.7);ctx.beginPath();ctx.arc(-36,26,3,0,PI*2);ctx.fill();ctx.beginPath();ctx.arc(36,26,3,0,PI*2);ctx.fill();
  // Head
  ctx.fillStyle=ink(14,10,6,0.9);ctx.beginPath();ctx.arc(0,0,11,0,PI*2);ctx.fill();
  // Scholar hat (fang jin)
  ctx.fillStyle=ink(6,4,2,0.9);ctx.fillRect(-14,-16,28,4);ctx.fillRect(-8,-22,16,8);
  // Sash
  ctx.fillStyle=ink(140,110,70,0.4);ctx.fillRect(-8,30,16,2.5);
  // Beard hint
  ctx.fillStyle=ink(10,8,6,0.3);ctx.beginPath();ctx.ellipse(0,8,5,3,0,0,PI*2);ctx.fill();
  ctx.globalAlpha=1;ctx.restore();
}

// CHARACTER: captain
function drawCaptain(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  // Broad robe
  ctx.fillStyle=ink(10,8,7,0.85);
  ctx.beginPath();ctx.moveTo(-20,20);ctx.quadraticCurveTo(-24,16,-16,14);ctx.quadraticCurveTo(0,10,16,14);ctx.quadraticCurveTo(24,16,20,20);
  ctx.quadraticCurveTo(18,56,0,60);ctx.quadraticCurveTo(-18,56,-20,20);ctx.fill();
  // Broad shoulders
  ctx.fillStyle=ink(11,9,8,0.8);ctx.fillRect(-26,16,52,8);
  // Arms
  ctx.fillStyle=ink(9,7,6,0.8);ctx.beginPath();ctx.moveTo(-26,20);ctx.lineTo(-34,36);ctx.lineTo(-24,38);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(26,20);ctx.lineTo(34,36);ctx.lineTo(24,38);ctx.closePath();ctx.fill();
  // Head
  ctx.fillStyle=ink(14,10,6,0.9);ctx.beginPath();ctx.arc(0,0,12,0,PI*2);ctx.fill();
  // Headband
  ctx.fillStyle=ink(4,3,2,0.9);ctx.fillRect(-14,-12,28,4);
  ctx.globalAlpha=1;ctx.restore();
}

// CHARACTER: bannerman
function drawBannerman(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  // Armor/robe
  ctx.fillStyle=ink(10,9,8,0.85);
  ctx.beginPath();ctx.moveTo(-16,16);ctx.quadraticCurveTo(-20,12,-14,10);ctx.quadraticCurveTo(0,6,14,10);ctx.quadraticCurveTo(20,12,16,16);
  ctx.quadraticCurveTo(14,52,0,56);ctx.quadraticCurveTo(-14,52,-16,16);ctx.fill();
  // Shoulder guards
  ctx.fillStyle=ink(16,14,12,0.8);ctx.fillRect(-22,14,8,12);ctx.fillRect(14,14,8,12);
  // Head
  ctx.fillStyle=ink(14,10,6,0.9);ctx.beginPath();ctx.arc(0,0,11,0,PI*2);ctx.fill();
  // Helmet
  ctx.fillStyle=ink(18,14,10,0.85);ctx.fillRect(-12,-4,24,4);ctx.fillRect(-5,-14,10,12);ctx.fillRect(-14,-4,28,2);
  ctx.globalAlpha=1;ctx.restore();
}

// CHARACTER: wife
function drawWife(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  // Slender robe
  ctx.fillStyle=ink(18,14,12,0.8);
  ctx.beginPath();ctx.moveTo(-12,18);ctx.quadraticCurveTo(-16,12,-10,10);ctx.quadraticCurveTo(0,6,10,10);ctx.quadraticCurveTo(16,12,12,18);
  ctx.quadraticCurveTo(10,52,0,56);ctx.quadraticCurveTo(-10,52,-12,18);ctx.fill();
  // Sleeves
  ctx.fillStyle=ink(16,12,10,0.75);ctx.beginPath();ctx.moveTo(-16,16);ctx.quadraticCurveTo(-26,20,-24,32);ctx.quadraticCurveTo(-20,30,-14,22);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(16,16);ctx.quadraticCurveTo(26,20,24,32);ctx.quadraticCurveTo(20,30,14,22);ctx.closePath();ctx.fill();
  // Head
  ctx.fillStyle=ink(18,12,8,0.85);ctx.beginPath();ctx.arc(0,0,9,0,PI*2);ctx.fill();
  // Hair bun
  ctx.fillStyle=ink(6,4,2,0.85);ctx.beginPath();ctx.ellipse(0,-10,10,14,0,0,PI*2);ctx.fill();
  ctx.globalAlpha=1;ctx.restore();
}

// ==================== SCENE RENDERERS ====================
function scene_cityWall(){
  const w=cv.width,h=cv.height;sky([[0,18,16,20],[0.45,28,24,30],[0.7,42,30,22],[1,20,14,8]]);
  inkMountains(h*0.38,h*0.12,5,8,5,6);mistBand(h*0.42,h*0.07,0.08,0.02);
  ctx.fillStyle=ink(14,12,10,0.6);ctx.fillRect(0,h*0.48,w,h*0.52);
  // City wall
  const wy=h*0.5;ctx.fillStyle=ink(10,8,6,0.9);ctx.fillRect(0,wy,w,h-wy);
  for(let i=0;i<32;i++){ctx.fillStyle=ink(12,10,8,0.7);ctx.fillRect(i*(w/32),wy,3,h*0.06);ctx.fillStyle=ink(8,6,4,0.5);ctx.fillRect(i*(w/32),(wy+h*0.06),3,2)}
  // Battlements
  for(let i=0;i<20;i++){const bx=i*(w/19);ctx.fillStyle=ink(12,9,7,0.85);ctx.fillRect(bx,wy-h*0.03,w/38+2,h*0.04)}
  // Gate
  const gx=w*0.42,gw=w*0.16;ctx.fillStyle=ink(4,3,2,0.9);ctx.fillRect(gx,wy+2,gw,h*0.12);ctx.fillStyle=ink(6,5,3,0.6);ctx.beginPath();ctx.arc(gx+gw/2,wy+h*0.06,gw*0.45,PI,0);ctx.fill();
  // Lanterns on gate
  lantern(gx+8,wy-6,8,true);lantern(gx+gw-16,wy-6,8,true);
  // Distant roofs inside city
  for(let i=0;i<8;i++){const rx=w*0.22+i*w*0.07,ry=wy-h*0.02;chineseRoof(rx,ry,18,8,ink(8,6,4,0.5))}
  drawScholar(w*0.28,h*0.62,1.05);
  // Particles: dust motes
  for(let i=0;i<4;i++){ctx.fillStyle=ink(180,160,140,0.3);ctx.beginPath();ctx.arc(random()*w,random()*h*0.5,1,0,PI*2);ctx.fill()}
}

function scene_courtyard(){
  const w=cv.width,h=cv.height;sky([[0,6,5,12],[0.5,10,8,18],[1,8,7,10]]);
  moon(w*0.8,h*0.18,28,0.3);inkMountains(h*0.55,h*0.1,4,100,90,70);
  // Courtyard walls
  ctx.fillStyle=ink(12,10,8,0.8);ctx.fillRect(w*0.06,h*0.25,w*0.88,h*0.6);
  ctx.fillStyle=ink(8,7,6,0.85);ctx.fillRect(w*0.08,h*0.27,w*0.84,h*0.56);
  // Roof
  chineseRoof(w*0.5,h*0.25,w*0.9,24,ink(6,5,4,0.85));
  // Pillars
  for(let i=2;i<=8;i++){ctx.fillStyle=ink(14,12,10,0.7);ctx.fillRect(w*0.04*i+2,h*0.22,3,16)}
  // Window
  ctx.fillStyle=ink(22,18,12,0.25);ctx.fillRect(w*0.38,h*0.36,14,18);
  ctx.fillStyle=ink(10,8,6,0.5);ctx.fillRect(w*0.38,h*0.36,14,1);ctx.fillRect(w*0.38,h*0.36,1,18);ctx.fillRect(w*0.38,h*0.45,14,1);
  // Stone ground
  ctx.fillStyle=ink(10,8,6,0.4);ctx.fillRect(w*0.1,h*0.78,w*0.8,h*0.02);
  // Tree
  inkTree(w*0.82,h*0.5,40,20);

// ==================== SKY HELPER ====================
function sky(stops){
  const w=cv.width,h=cv.height,g=ctx.createLinearGradient(0,0,0,h);
  stops.forEach(([p,r,g,b])=>g.addColorStop(p,`rgb(${r},${g},${b})`));
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
}
function moon(x,y,r,a){ctx.fillStyle=ink(200,190,160,a);ctx.beginPath();ctx.arc(x,y,r,0,PI*2);ctx.fill();ctx.fillStyle=ink(180,170,140,a*0.4);ctx.beginPath();ctx.arc(x,y,r*1.6,0,PI*2);ctx.fill()}

// ==================== GAMEPLAY ====================
function renderFrame(){if(game.cs&&renderers[game.cs.bg])renderers[game.cs.bg]();time++}
titleEl.onclick=()=>{titleEl.style.display='none';lineSel.classList.add('on')};
function startGame(line){
  game.line=line;sIdx=0;di=0;playing=true;lineSel.classList.remove('on');
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();showScene(0);
}
function showScene(idx){
  sIdx=idx;di=0;const sl=scenes[game.line];if(!sl||idx>=sl.length){endGame();return}
  const sc=sl[idx];game.cs=sc;setAmbient(sc.ambient);
  if(sc.ep){const e=sc.ep;epEl.querySelector('.en').textContent=e.num;epEl.querySelector('.em').textContent=e.name;epEl.querySelector('.el').textContent=e.line;epEl.classList.add('on');setTimeout(()=>{epEl.classList.remove('on');showDlg()},2800)}
  else showDlg();
  if(!rf)rf=requestAnimationFrame(gameLoop);
}
function gameLoop(){renderFrame();if(playing)rf=requestAnimationFrame(gameLoop);else rf=null}
function showDlg(){const sc=scenes[game.line][sIdx];if(di>=sc.dialogs.length){showCh(sc.choices);return}const d=sc.dialogs[di];dlgS.textContent=d.s;dlgT.textContent=d.t;dlg.classList.add('on');chEl.classList.remove('on')}
dlg.onclick=()=>{di++;showDlg()};
function showCh(chs){dlg.classList.remove('on');chEl.innerHTML='';chs.forEach(ch=>{const b=document.createElement('button');b.className='ch';b.textContent=ch.text;b.onclick=()=>{if(ch.w)Object.entries(ch.w).forEach(([k,v])=>setW(k,v));chEl.classList.remove('on');dlg.classList.remove('on');if(ch.next==='end')endGame();else if(typeof ch.next==='number')showScene(ch.next)};chEl.appendChild(b)});chEl.classList.add('on')}
function endGame(){setAmbient(null);playing=false;dlg.classList.remove('on');chEl.classList.remove('on');dlgS.textContent='';dlgT.textContent='第一章 完';dlg.classList.add('on');setTimeout(()=>{dlg.classList.remove('on');lineSel.classList.add('on');sIdx=0;di=0},3500)}
resize();renderFrame();
