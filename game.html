<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>甲申 · Jiashen 1644</title>
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #e8dcc8;
    --fade: #8b7e6a;
    --red: #8b2500;
    --gold: #c4a35a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body {
    background:#0a0a0a;
    display:flex;justify-content:center;align-items:center;
    height:100vh;overflow:hidden;
    font-family:'Noto Serif SC','SimSun','KaiTi',serif;
  }
  #game {
    position:relative;
    width:100vw;height:100vh;
    max-width:900px;max-height:600px;
    overflow:hidden;
  }
  canvas{display:block;position:absolute;top:0;left:0;width:100%;height:100%}

  /* Dialogue overlay */
  #dlg {
    position:absolute;bottom:0;left:0;right:0;
    background:linear-gradient(transparent,rgba(0,0,0,0.85) 30%,rgba(0,0,0,0.95));
    padding:60px 30px 24px;
    display:none;
    cursor:pointer;
    transition:opacity 0.3s;
  }
  #dlg.visible{display:block}
  #dlg .speaker {
    font-size:0.72rem;color:var(--gold);
    margin-bottom:6px;letter-spacing:2px;
  }
  #dlg .text {
    font-size:1rem;color:var(--paper);
    line-height:1.8;letter-spacing:1px;
  }
  #dlg .next-hint {
    text-align:right;font-size:0.65rem;color:var(--fade);
    margin-top:10px;animation:blink 2s infinite;
  }
  @keyframes blink{0%,100%{opacity:0.4}50%{opacity:1}}

  /* Choices */
  #choices {
    position:absolute;bottom:0;left:0;right:0;
    padding:40px 30px 30px;
    display:none;
    background:linear-gradient(transparent,rgba(0,0,0,0.9) 20%);
  }
  #choices.visible{display:flex;flex-direction:column;gap:10px}
  .choice-btn {
    background:rgba(28,24,18,0.85);
    border:1px solid rgba(196,163,90,0.3);
    color:var(--paper);
    padding:14px 20px;
    font-family:inherit;font-size:0.9rem;
    cursor:pointer;text-align:left;letter-spacing:1px;
    transition:all 0.25s;border-radius:4px;
  }
  .choice-btn:hover{background:rgba(40,32,20,0.9);border-color:var(--gold);padding-left:28px}

  /* Title screen */
  #title {
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,rgba(20,15,10,0.3),rgba(0,0,0,0.9));
    cursor:pointer;
  }
  #title h1 {
    font-size:3rem;color:var(--paper);letter-spacing:8px;
    font-weight:400;margin-bottom:8px;
  }
  #title .sub {
    font-size:0.8rem;color:var(--fade);letter-spacing:4px;margin-bottom:40px;
  }
  #title .start-hint {
    font-size:0.7rem;color:var(--gold);
    animation:blink 2s infinite;letter-spacing:3px;
  }

  /* Line select */
  #lineSelect {
    position:absolute;inset:0;
    display:none;flex-direction:column;
    align-items:center;justify-content:center;
    background:rgba(0,0,0,0.92);
    gap:16px;
  }
  #lineSelect.visible{display:flex}
  .line-btn {
    background:transparent;
    border:1px solid rgba(196,163,90,0.3);
    color:var(--paper);
    padding:20px 40px;
    font-family:inherit;font-size:1rem;
    cursor:pointer;letter-spacing:3px;
    width:280px;text-align:center;
    transition:all 0.3s;
  }
  .line-btn:hover{background:rgba(40,32,20,0.5);border-color:var(--gold)}
  .line-btn .line-label{font-size:0.6rem;color:var(--fade);margin-bottom:6px;letter-spacing:2px}

  /* Episode title */
  #epTitle {
    position:absolute;inset:0;
    display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,0.95);
    flex-direction:column;
  }
  #epTitle.visible{display:flex}
  #epTitle .ep-num{font-size:0.7rem;color:var(--gold);letter-spacing:3px}
  #epTitle .ep-name{font-size:1.5rem;color:var(--paper);margin-top:8px;letter-spacing:4px}
  #epTitle .ep-line{font-size:0.75rem;color:var(--fade);margin-top:6px}
</style>
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>
  <div id="title">
    <h1>甲 申</h1>
    <div class="sub">J I A S H E N · 1 6 4 4</div>
    <div class="start-hint">点击开始</div>
  </div>
  <div id="lineSelect">
    <button class="line-btn" onclick="startGame('A')">
      <div class="line-label">第一线</div>士 · 国子监生
    </button>
    <button class="line-btn" onclick="startGame('B')">
      <div class="line-label">第二线</div>海 · 走私船主
    </button>
    <button class="line-btn" onclick="startGame('C')">
      <div class="line-label">第三线</div>隐 · 汉人旗兵
    </button>
  </div>
  <div id="epTitle">
    <div class="ep-num"></div>
    <div class="ep-name"></div>
    <div class="ep-line"></div>
  </div>
  <div id="dlg"><div class="speaker"></div><div class="text"></div><div class="next-hint">点击继续</div></div>
  <div id="choices"></div>
</div>

<script>
// ==================== GAME ENGINE ====================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const dlg = document.getElementById('dlg');
const dlgSpeaker = dlg.querySelector('.speaker');
const dlgText = dlg.querySelector('.text');
const choicesEl = document.getElementById('choices');
const titleEl = document.getElementById('title');
const lineSelectEl = document.getElementById('lineSelect');
const epTitleEl = document.getElementById('epTitle');

let game = { line:null, sceneIdx:0, dialogIdx:0, choices:null, choiceMade:false, titleShown:false, currentScene:null };
let worldState = loadWorld();

function resize() {
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;
}
window.addEventListener('resize', resize);
resize();

// ==================== WORLD STATE ====================
function loadWorld() {
  try { return JSON.parse(localStorage.getItem('jiashen_world')) || {}; } catch(e) { return {}; }
}
function saveWorld() {
  try { localStorage.setItem('jiashen_world', JSON.stringify(worldState)); } catch(e) {}
}
function setWorld(key, val) { worldState[key] = val; saveWorld(); }

// ==================== SCENE DATA ====================
const scenes = {
  A: [
    {
      bg:'city_wall_dusk', char:'scholar', epTitle:{num:'第一章',name:'留发不留头',line:'A 线 · 士 · 南京'},
      dialogs:[
        {speaker:'沈临川',text:'城墙上的风，今天格外冷。'},
        {speaker:'沈临川',text:'崇祯十七年，三月十九。陛下在煤山……不说了。'},
        {speaker:'沈临川',text:'（远处有马蹄声）'},
        {speaker:'老仆',text:'公子，快回府吧。李自成的兵已经过了淮安，南京城里人人自危。'},
        {speaker:'沈临川',text:'我还能在这城墙上站多久。'},
      ],
      choices:[
        {text:'回府收拾行李，带家人出城',next:1,world:{choice1:'flee'}},
        {text:'去国子监，看看还有谁在',next:2,world:{choice1:'stay'}},
      ]
    },
    {
      bg:'courtyard_night', char:'scholar', epTitle:null,
      dialogs:[
        {speaker:'沈临川',text:'府里一片狼藉。下人们已经跑了一半。'},
        {speaker:'妻',text:'相公，真的要走了吗。南京可是我们的家。'},
        {speaker:'沈临川',text:'（攥着手里的碎银）这些够我们走到扬州。到了扬州再想办法。'},
        {speaker:'沈临川',text:'我把剩下的碎银分给了邻居们。他们走不走，各安天命吧。'},
      ],
      choices:[ {text:'连夜出城',next:3,world:{fled:true}} ]
    },
    {
      bg:'academy_dusk', char:'scholar', epTitle:null,
      dialogs:[
        {speaker:'沈临川',text:'国子监里烛火还在亮。几个同年还在抄书。'},
        {speaker:'同年',text:'临川兄，你怎么还没走？'},
        {speaker:'沈临川',text:'我也不知道我为什么要来。大概是想看看——还有没有人记得这是什么地方。'},
        {speaker:'同年',text:'（沉默片刻）出城的最后一批船，明早卯时。'},
      ],
      choices:[
        {text:'上船，跟同年一起走',next:3,world:{fled:true}},
        {text:'留下，去衙门看看出了什么事',next:4,world:{fled:false}},
      ]
    },
    {
      bg:'river_dawn', char:'boat', epTitle:null,
      dialogs:[
        {speaker:'沈临川',text:'江面上风很大。回头看，南京的城墙像一道剪影。'},
        {speaker:'沈临川',text:'我不知道这辈子还能不能回来。'},
        {speaker:'沈临川',text:'（手里还有一封没写完的家书，收信人是亡妻）'},
      ],
      choices:[ {text:'[第一章 终]',next:'end_chapter1'} ]
    },
    {
      bg:'yamen_dusk', char:'scholar', epTitle:null,
      dialogs:[
        {speaker:'沈临川',text:'衙门里空了。公案上落了一层灰。'},
        {speaker:'沈临川',text:'墙上还有一张没来得及撤下来的海捕文书。上面画的人，像我的一个老师。'},
        {speaker:'沈临川',text:'（风穿堂而过，文书被吹到地上）'},
      ],
      choices:[ {text:'[第一章 终]',next:'end_chapter1'} ]
    },
  ],
  B: [
    {
      bg:'sea_sunset', char:'captain', epTitle:{num:'第一章',name:'两头不靠岸',line:'B 线 · 海 · 料罗湾'},
      dialogs:[
        {speaker:'陈海生',text:'又一天。海上的日落跟岸上的——算了。'},
        {speaker:'船工',text:'头，风向变了。再不出港，季风一过这批货得在船上烂半年。'},
        {speaker:'陈海生',text:'郑家的旗还挂着吗。'},
        {speaker:'船工',text:'旗还在。但岸上消息说清兵已经到了福建。旗还管不管用，不知道。'},
      ],
      choices:[
        {text:'带货运去台湾，找郑家的人',next:1,world:{bChoice:'taiwan'}},
        {text:'把货运回泉州港，回家',next:2,world:{bChoice:'home'}},
      ]
    },
    {
      bg:'stormy_sea', char:'captain', epTitle:null,
      dialogs:[
        {speaker:'陈海生',text:'海上起了浪。船舱里有一个偷渡的小孩，我发现了，但没出声。'},
        {speaker:'陈海生',text:'让他躲着吧。'},
      ],
      choices:[ {text:'[第一章 终]',next:'end_chapter1'} ]
    },
    {
      bg:'port_dusk', char:'captain', epTitle:null,
      dialogs:[
        {speaker:'陈海生',text:'泉州港不像以前了。码头上的旗换成了我没见过的。'},
        {speaker:'陈海生',text:'家里还亮着灯。但我不知道自己还算不算陈家的人。'},
      ],
      choices:[ {text:'[第一章 终]',next:'end_chapter1'} ]
    },
  ],
  C: [
    {
      bg:'camp_fire', char:'bannerman', epTitle:{num:'第一章',name:'哪边的',line:'C 线 · 隐 · 盛京'},
      dialogs:[
        {speaker:'佟阿林',text:'（望着火堆出神）'},
        {speaker:'旗兵兄弟',text:'喂，阿林。想啥呢？'},
        {speaker:'佟阿林',text:'我在想我们家以前过年杀猪。'},
        {speaker:'旗兵兄弟',text:'（笑）明天南下，有的是猪给你杀。'},
        {speaker:'佟阿林',text:'（嘴角动了一下，但没笑出来）'},
      ],
      choices:[
        {text:'把手里的干粮塞给旁边的汉人俘虏',next:1,world:{cChoice:'kind'}},
        {text:'站起来，走向长官的帐，申请明天的前锋位置',next:2,world:{cChoice:'advance'}},
      ]
    },
    {
      bg:'camp_night', char:'bannerman', epTitle:null,
      dialogs:[
        {speaker:'佟阿林',text:'那个俘虏愣了一下，接过干粮，什么都没说。'},
        {speaker:'佟阿林',text:'他可能以为我要害他。也可能他知道不是。我们没再说一句话。'},
      ],
      choices:[ {text:'[第一章 终]',next:'end_chapter1'} ]
    },
    {
      bg:'camp_dawn', char:'bannerman', epTitle:null,
      dialogs:[
        {speaker:'佟阿林',text:'长官看了我一眼。他什么也没说，在纸上写了我的名字。'},
        {speaker:'佟阿林',text:'我也不知道为什么想冲前面。大概是证明点什么。大概是——证明我是真的。'},
      ],
      choices:[ {text:'[第一章 终]',next:'end_chapter1'} ]
    },
  ],
};

// ==================== RENDERER ====================
function drawBackground(bgId) {
  const w = canvas.width, h = canvas.height;
  const grad = ctx.createLinearGradient(0,0,0,h);

  switch(bgId) {
    case 'city_wall_dusk':
      grad.addColorStop(0,'#2a2520'); grad.addColorStop(0.5,'#3d3025'); grad.addColorStop(1,'#1a1510');
      ctx.fillStyle=grad; ctx.fillRect(0,0,w,h);
      ctx.fillStyle='#1a1510'; ctx.fillRect(0,h*0.55,w,h*0.45);
      for(let i=0;i<12;i++) ctx.fillRect(i*w/12,h*0.5,8,30);
      ctx.fillStyle='#252018'; ctx.beginPath();ctx.moveTo(0,h*0.5);for(let i=0;i<=w;i+=30)ctx.lineTo(i,h*0.45+Math.sin(i*0.01)*25);ctx.lineTo(w,h*0.55);ctx.fill();
      ctx.fillStyle='rgba(180,120,60,0.15)'; ctx.fillRect(w*0.4,0,w*0.3,h*0.5);
      break;
    case 'courtyard_night':
      grad.addColorStop(0,'#0f0e12'); grad.addColorStop(0.5,'#1a1620'); grad.addColorStop(1,'#0a090f');
      ctx.fillStyle=grad; ctx.fillRect(0,0,w,h);
      ctx.fillStyle='#131018'; ctx.fillRect(w*0.1,h*0.2,w*0.8,h*0.6);
      ctx.fillStyle='#1a1522'; for(let i=3;i<=8;i++)ctx.fillRect(w*0.05*i,h*0.15,3,12);
      ctx.fillStyle='rgba(200,180,140,0.2)'; ctx.beginPath();ctx.arc(w*0.75,h*0.2,30,0,Math.PI*2);ctx.fill();
      break;
    case 'academy_dusk':
      grad.addColorStop(0,'#1a1815'); grad.addColorStop(1,'#0f0e0c');
      ctx.fillStyle=grad; ctx.fillRect(0,0,w,h);
      ctx.fillStyle='#252018'; ctx.fillRect(w*0.2,h*0.35,w*0.6,h*0.5);
      ctx.fillStyle='rgba(200,160,80,0.25)'; ctx.fillRect(w*0.4,h*0.4,8,15);
      break;
    case 'river_dawn':
      grad.addColorStop(0,'#1a1a20'); grad.addColorStop(0.6,'#2a3035'); grad.addColorStop(1,'#1a2020');
      ctx.fillStyle=grad; ctx.fillRect(0,0,w,h);
      ctx.fillStyle='#0a0a15'; ctx.fillRect(0,h*0.6,w,h*0.4);
      ctx.fillStyle='rgba(180,160,120,0.15)'; ctx.fillRect(w*0.2,h*0.1,w*0.6,h*0.15);
      break;
    case 'sea_sunset':
      grad.addColorStop(0,'#1a1820');grad.addColorStop(0.3,'#2a2540');grad.addColorStop(0.6,'#3a3040');grad.addColorStop(1,'#0a0a15');
      ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
      ctx.fillStyle='#0a0a18';ctx.fillRect(0,h*0.6,w,h*0.4);
      ctx.fillStyle='rgba(200,140,80,0.2)';ctx.beginPath();ctx.arc(w*0.65,h*0.55,50,0,Math.PI*2);ctx.fill();
      break;
    case 'port_dusk':
      grad.addColorStop(0,'#1a1610');grad.addColorStop(1,'#0f0c08');
      ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
      ctx.fillStyle='#151210';ctx.fillRect(0,h*0.55,w,h*0.45);
      for(let i=0;i<6;i++){ctx.fillStyle='#1a1510';ctx.fillRect(w*0.1+i*w*0.15,h*0.5,4,40)}
      break;
    case 'camp_fire':
      grad.addColorStop(0,'#0f0e12');grad.addColorStop(1,'#1a1410');
      ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
      ctx.fillStyle='#0a090f';for(let i=0;i<40;i++)ctx.fillRect(Math.random()*w,Math.random()*h,2,8);
      ctx.fillStyle='rgba(200,120,40,0.3)';ctx.beginPath();ctx.arc(w*0.5,h*0.5,20,0,Math.PI*2);ctx.fill();
      for(let i=0;i<8;i++){ctx.fillStyle='rgba(220,160,60,'+(0.5-Math.random()*0.3)+')';ctx.fillRect(w*0.48+Math.random()*w*0.04,h*0.4+Math.random()*h*0.1,2,6)}
      break;
    case 'camp_night':
      grad.addColorStop(0,'#0a0a12');grad.addColorStop(1,'#0f0c0a');
      ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
      ctx.fillStyle='rgba(180,140,80,0.08)';ctx.beginPath();ctx.arc(w*0.7,h*0.3,25,0,Math.PI*2);ctx.fill();
      break;
    case 'camp_dawn':
      grad.addColorStop(0,'#151820');grad.addColorStop(1,'#1a1510');
      ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
      ctx.fillStyle='rgba(200,160,100,0.1)';ctx.fillRect(w*0.3,0,w*0.4,h*0.5);
      break;
    case 'stormy_sea':
      grad.addColorStop(0,'#0f1018');grad.addColorStop(0.5,'#1a2530');grad.addColorStop(1,'#0a0e15');
      ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
      ctx.fillStyle='#0a0e18';ctx.fillRect(0,h*0.6,w,h*0.4);
      for(let i=0;i<15;i++){ctx.fillStyle='rgba(180,200,220,0.3)';ctx.fillRect(w*0.15+Math.random()*w*0.7,h*0.5+Math.random()*h*0.3,1,8)}
      break;
    case 'yamen_dusk':
      grad.addColorStop(0,'#1a1615');grad.addColorStop(1,'#0f0e0c');
      ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
      ctx.fillStyle='#201815';ctx.fillRect(w*0.1,h*0.3,w*0.8,h*0.5);
      ctx.fillStyle='#1a1210';ctx.fillRect(w*0.45,h*0.35,2,25);
      break;
    default:
      grad.addColorStop(0,'#1a1810');grad.addColorStop(1,'#0a0908');
      ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
  }
}

function drawCharacter(charId) {
  const w=canvas.width, h=canvas.height;
  ctx.globalAlpha = 0.85;
  if (charId==='scholar') {
    ctx.fillStyle='#0a0808';
    ctx.beginPath();ctx.ellipse(w*0.45,h*0.42,14,22,0,0,Math.PI*2);ctx.fill();
    ctx.fillRect(w*0.44,h*0.46,18,38);
    ctx.fillRect(w*0.44,h*0.52,18,6); ctx.fillRect(w*0.43,h*0.52,22,3);
    ctx.fillStyle='rgba(120,100,80,0.4)';ctx.fillRect(w*0.445,h*0.55,17,2);
  } else if (charId==='boat') {
    ctx.fillStyle='#0a0808';
    ctx.beginPath();ctx.moveTo(w*0.3,h*0.7);ctx.lineTo(w*0.7,h*0.7);ctx.lineTo(w*0.6,h*0.75);ctx.lineTo(w*0.4,h*0.75);ctx.fill();
    ctx.fillStyle='#1a1510';ctx.fillRect(w*0.47,h*0.55,3,40);
  } else if (charId==='captain') {
    ctx.fillStyle='#0a0808';
    ctx.beginPath();ctx.ellipse(w*0.48,h*0.4,16,24,0,0,Math.PI*2);ctx.fill();
    ctx.fillRect(w*0.46,h*0.44,22,42);
    ctx.fillRect(w*0.445,h*0.52,26,4);
  } else if (charId==='bannerman') {
    ctx.fillStyle='#0a0808';
    ctx.beginPath();ctx.ellipse(w*0.47,h*0.38,16,22,0,0,Math.PI*2);ctx.fill();
    ctx.fillRect(w*0.455,h*0.42,20,40);
    ctx.fillRect(w*0.44,h*0.38,26,5);
    ctx.fillStyle='#1a1210';ctx.fillRect(w*0.455,h*0.5,20,3);
  }
  ctx.globalAlpha = 1;
  if (['city_wall_dusk','academy_dusk','camp_fire'].includes(game.currentScene?.bg)) {
    for(let i=0;i<3;i++) {
      ctx.fillStyle='rgba(200,180,150,'+(0.3+Math.random()*0.2)+')';
      ctx.beginPath();ctx.arc(Math.random()*w,Math.random()*h*0.5,1.5,0,Math.PI*2);ctx.fill();
    }
  }
}

// ==================== GAMEPLAY ====================
let currentSceneIdx = 0;
let currentDialogIdx = 0;
let isPlaying = false;

titleEl.onclick = () => {
  titleEl.style.display='none';
  lineSelectEl.classList.add('visible');
};

function startGame(line) {
  game.line = line;
  currentSceneIdx = 0;
  currentDialogIdx = 0;
  isPlaying = true;
  lineSelectEl.classList.remove('visible');
  showScene(0);
}

function showScene(idx) {
  currentSceneIdx = idx;
  currentDialogIdx = 0;
  const sceneList = scenes[game.line];
  if (!sceneList || idx >= sceneList.length) { showEnd(); return; }
  const scene = sceneList[idx];
  game.currentScene = scene;

  drawBackground(scene.bg);
  drawCharacter(scene.char);

  if (scene.epTitle) {
    const ep = scene.epTitle;
    epTitleEl.querySelector('.ep-num').textContent = ep.num;
    epTitleEl.querySelector('.ep-name').textContent = ep.name;
    epTitleEl.querySelector('.ep-line').textContent = ep.line;
    epTitleEl.classList.add('visible');
    setTimeout(() => { epTitleEl.classList.remove('visible'); showDialog(); }, 2500);
  } else {
    showDialog();
  }
}

function showDialog() {
  const scene = scenes[game.line][currentSceneIdx];
  if (currentDialogIdx >= scene.dialogs.length) {
    showChoices(scene.choices);
    return;
  }
  const d = scene.dialogs[currentDialogIdx];
  dlgSpeaker.textContent = d.speaker;
  dlgText.textContent = d.text;
  dlg.classList.add('visible');
  choicesEl.classList.remove('visible');
}

dlg.onclick = () => {
  currentDialogIdx++;
  showDialog();
};

function showChoices(choices) {
  dlg.classList.remove('visible');
  choicesEl.innerHTML = '';
  choices.forEach(ch => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = ch.text;
    btn.onclick = () => {
      if (ch.world) Object.entries(ch.world).forEach(([k,v]) => setWorld(k,v));
      choicesEl.classList.remove('visible');
      dlg.classList.remove('visible');
      if (ch.next === 'end_chapter1') {
        showEnd();
      } else if (typeof ch.next === 'number') {
        showScene(ch.next);
      }
    };
    choicesEl.appendChild(btn);
  });
  choicesEl.classList.add('visible');
}

function showEnd() {
  ctx.fillStyle='#0a0a0a'; ctx.fillRect(0,0,canvas.width,canvas.height);
  dlg.classList.remove('visible');
  choicesEl.classList.remove('visible');
  dlgSpeaker.textContent = '';
  dlgText.textContent = '第一章 完';
  dlg.querySelector('.next-hint').style.display = 'none';
  dlg.classList.add('visible');
  isPlaying = false;
  setTimeout(() => {
    dlg.classList.remove('visible');
    dlg.querySelector('.next-hint').style.display = '';
    lineSelectEl.classList.add('visible');
    currentSceneIdx = 0;
    currentDialogIdx = 0;
  }, 3000);
}

// Initial render
drawBackground('default');
</script>
</body>
</html>
