<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>莫桑</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky-top: #f5efe0;
    --sky-bot: #eedac4;
    --ground: #c9a88c;
    --text: #5c4a3a;
    --progress: #c8a082;
    --sunset: #d4a08a;
  }

  body {
    font-family: "PingFang SC", "Noto Serif SC", "STSong", "Songti SC", "Microsoft YaHei", serif;
    background: #e8d9c8;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  .game-container {
    position: relative;
    width: 100%;
    max-width: 400px;
    aspect-ratio: 3 / 5;
    background: var(--sky-top);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(139, 111, 94, 0.15);
  }

  canvas { display: block; width: 100%; height: 100%; }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    pointer-events: none;
    z-index: 2;
    background: rgba(245, 239, 224, 0.78);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: opacity 0.4s;
  }
  .overlay.active { pointer-events: auto; }

  .overlay-title {
    font-size: 34px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.06em;
  }
  .overlay-sub {
    font-size: 14px;
    color: #8b7a62;
    letter-spacing: 0.08em;
  }
  .overlay-score {
    font-size: 56px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }
  .overlay-poem {
    font-size: 16px;
    color: #8b6f5e;
    text-align: center;
    line-height: 1.8;
    letter-spacing: 0.05em;
    max-width: 260px;
  }

  .btn {
    padding: 12px 36px;
    border-radius: 999px;
    border: 1.5px solid var(--ground);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: all 0.25s;
    font-family: inherit;
    background: rgba(255,255,255,0.6);
    color: var(--text);
  }
  .btn:active { transform: scale(0.96); background: var(--ground); }

  .btn-primary {
    background: var(--ground);
    color: #fff;
    border: none;
  }
  .btn-primary:active { background: #b89578; }

  .btn-row { display: flex; gap: 10px; }
  .best-text { font-size: 13px; color: #8b7a62; display: flex; align-items: center; gap: 4px; }
  .hidden { display: none !important; }

  .level-up-name {
    font-size: 40px;
    font-weight: 700;
    color: var(--sunset);
    letter-spacing: 0.1em;
  }

  .charge-hint {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: #8b7a62;
    z-index: 1;
    pointer-events: none;
    opacity: 0.7;
  }
</style>
</head>
<body>

<div class="game-container" id="gameContainer">
  <canvas id="gameCanvas"></canvas>

  <!-- 开始 -->
  <div class="overlay active" id="startScreen">
    <p class="overlay-title">莫 桑</p>
    <p class="overlay-sub">按住蓄力 · 松手跳跃 · 空中再跳</p>
    <button class="btn btn-primary" id="btnStart">开始游戏</button>
    <p class="best-text" id="bestDisplay"></p>
  </div>

  <!-- 过关 -->
  <div class="overlay hidden" id="levelUpScreen">
    <p class="overlay-sub" id="levelUpLabel">第 1 关 通过</p>
    <p class="level-up-name" id="levelUpName"></p>
  </div>

  <!-- 通关 -->
  <div class="overlay hidden" id="victoryScreen">
    <p class="overlay-sub">恭喜通关</p>
    <p class="overlay-title" style="font-size:22px;">行尽青山，长宁以至</p>
    <p class="overlay-poem" id="victoryPoem"></p>
    <div class="btn-row">
      <button class="btn" id="btnShare">分享成绩</button>
      <button class="btn btn-primary" id="btnReplay">再次出发</button>
    </div>
  </div>

  <!-- 失败 -->
  <div class="overlay hidden" id="endScreen">
    <p class="overlay-sub">止于 第 <span id="endLevel">1</span> 关</p>
    <p class="overlay-score" id="finalScore">0</p>
    <p class="overlay-sub">掠过 <span id="endDodged">0</span> 处风景 · 萤火 <span id="endFirefly">0</span> 只</p>
    <div class="btn-row" style="margin-top:8px;">
      <button class="btn" id="btnShareEnd">分享成绩</button>
      <button class="btn btn-primary" id="btnRetry">再次出发</button>
    </div>
  </div>

  <!-- 域名锁 -->
  <div class="overlay hidden" id="lockScreen" style="gap:20px;">
    <p class="overlay-title" style="font-size:22px;">此游戏仅在原站运行</p>
    <p class="overlay-sub">请访问 zhu-space.github.io 体验</p>
    <p class="overlay-sub" style="font-size:12px;opacity:0.6;">搬运代码不招待哦</p>
  </div>

  <p class="charge-hint" id="chargeHint">按住蓄力 · 松手起跳 · 空中点按再跳</p>
</div>

<script>
(function () {
  // --- 域名锁 ---
  var _a=atob("emh1LXNwYWNlLmdpdGh1Yi5pbw==");
  var _h=location.hostname;
  if (_h && _h!==_a && _h!=="localhost" && _h!=="127.0.0.1" && _h.indexOf("github.dev")===-1) {
    document.getElementById("lockScreen").classList.remove("hidden");
    document.getElementById("lockScreen").classList.add("active");
    return;
  }

  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const container = document.getElementById("gameContainer");

  const startScreen = document.getElementById("startScreen");
  const levelUpScreen = document.getElementById("levelUpScreen");
  const victoryScreen = document.getElementById("victoryScreen");
  const endScreen = document.getElementById("endScreen");
  const finalScoreEl = document.getElementById("finalScore");
  const endLevelEl = document.getElementById("endLevel");
  const endDodgedEl = document.getElementById("endDodged");
  const endFireflyEl = document.getElementById("endFirefly");
  const bestDisplay = document.getElementById("bestDisplay");
  const victoryPoem = document.getElementById("victoryPoem");
  const levelUpLabel = document.getElementById("levelUpLabel");
  const levelUpName = document.getElementById("levelUpName");
  const chargeHint = document.getElementById("chargeHint");

  const W = 400, H = 666;
  const GROUND_Y = H - 80;

  // ---- 关卡 ----
  const LEVELS = [
    { n:1, name:"初霁", target:8, speed:270, interval:1.6, types:["basic"] },
    { n:2, name:"知途", target:9, speed:290, interval:1.5, types:["basic","tall"] },
    { n:3, name:"随风", target:10, speed:320, interval:1.4, types:["basic","tall","fast"] },
    { n:4, name:"安渡", target:10, speed:340, interval:1.3, types:["basic","tall","fast","floating"] },
    { n:5, name:"观聚散", target:12, speed:360, interval:1.2, types:["basic","tall","fast","floating","moving"] },
    { n:6, name:"执经纬", target:12, speed:380, interval:1.15, types:["basic","tall","fast","floating","moving","spike"] },
    { n:7, name:"晚晴", target:13, speed:410, interval:1.05, types:["basic","tall","fast","floating","moving","spike","double"] },
    { n:8, name:"归行", target:14, speed:430, interval:1.0, types:["basic","tall","fast","floating","moving","spike","double","ghost"] },
    { n:9, name:"澄心", target:15, speed:460, interval:0.95, types:["basic","tall","fast","floating","moving","spike","double","ghost"] },
    { n:10, name:"长宁", target:20, speed:490, interval:0.9, types:["basic","tall","fast","floating","moving","spike","double","ghost"] },
  ];

  const POEMS = [
    "莫道桑榆晚，为霞尚满天",
    "苔花如米小，也学牡丹开",
    "心有经纬，何惧岁晚",
    "长风破浪会有时，直挂云帆济沧海",
    "千磨万击还坚劲，任尔东西南北风",
    "行到水穷处，坐看云起时",
    "山重水复疑无路，柳暗花明又一村",
    "会当凌绝顶，一览众山小",
    "不畏浮云遮望眼，自缘身在最高层",
    "回首向来萧瑟处，归去，也无风雨也无晴",
  ];

  // ---- 状态 ----
  const ST = { IDLE:0, PLAYING:1, LEVEL_UP:2, VICTORY:3, OVER:4 };
  let state = ST.IDLE;
  let currentLevel = 0, dodgedInLevel = 0, totalDodged = 0;
  let bestLevel = parseInt(localStorage.getItem("mosangBestLevel") || "0");

  // 玩家
  const PW = 30, PH = 30;
  let player = { x:80, y:0, vy:0, grounded:true, airJumps:0, invincible:0 };

  // 蓄力
  let charging = false, chargeStart = 0;
  const CHARGE_MAX = 0.7;
  const JUMP_MIN = -380, JUMP_MAX = -820;
  const DOUBLE_JUMP_VY = -560;

  // 萤火 + 护身
  let fireflies = [];
  let fireflyCount = 0;
  let shields = 0;
  const FIREFLIES_PER_SHIELD = 5;
  const MAX_SHIELDS = 3;

  // 障碍物 & 环境
  let obstacles = [];
  let particles = [];
  let clouds = [];
  let birds = [];
  let obstacleTimer = 0;
  let fireflyTimer = 0;
  let speed = 280, obstacleInterval = 1.5;
  let levelUpTimer = 0;
  let time = 0;
  let mountainPoints = [];

  function generateMountains() {
    mountainPoints = [{ x:-20, y:GROUND_Y+20 }];
    for (let x = 0; x <= W+20; x += 30)
      mountainPoints.push({ x, y:GROUND_Y - (40 + Math.sin(x*0.008)*35 + Math.sin(x*0.019+1.3)*25 + Math.sin(x*0.003)*50) });
    mountainPoints.push({ x:W+20, y:GROUND_Y+20 });
  }

  function initClouds() {
    clouds = [];
    for (let i = 0; i < 5; i++)
      clouds.push({ x:Math.random()*W, y:30+Math.random()*120, w:60+Math.random()*100, speed:8+Math.random()*15, alpha:0.25+Math.random()*0.25 });
  }

  function initBirds() {
    birds = [];
    for (let i = 0; i < 4; i++)
      birds.push({ x:Math.random()*W, y:50+Math.random()*100, vx:20+Math.random()*40, wing:Math.random()*Math.PI*2 });
  }

  function getCfg() { return LEVELS[currentLevel]; }

  // ---- 重置 ----
  function reset() {
    player.y = GROUND_Y - PH;
    player.vy = 0;
    player.grounded = true;
    player.airJumps = 0;
    player.invincible = 0;
    charging = false; chargeStart = 0;
    obstacles = []; particles = []; fireflies = [];
    obstacleTimer = 0; fireflyTimer = 0;
    currentLevel = 0; dodgedInLevel = 0; totalDodged = 0;
    fireflyCount = 0; shields = 0;
    const c = getCfg(); speed = c.speed; obstacleInterval = c.interval;
    levelUpTimer = 0;
  }

  // ---- 障碍物生成 ----
  function spawnObstacle() {
    const types = getCfg().types;
    const type = types[Math.floor(Math.random()*types.length)];
    const o = { x:W+20, scored:false, type };

    switch (type) {
      case "basic":   o.h=28+Math.random()*36; o.w=20+Math.random()*14; o.y=GROUND_Y-o.h; break;
      case "tall":    o.h=55+Math.random()*30; o.w=16+Math.random()*10; o.y=GROUND_Y-o.h; break;
      case "fast":    o.h=18+Math.random()*20; o.w=14+Math.random()*8; o.y=GROUND_Y-o.h; o.speedMul=1.3; break;
      case "floating":o.w=26+Math.random()*16; o.h=10+Math.random()*10; o.y=GROUND_Y-70-Math.random()*40; break;
      case "moving":  o.w=18+Math.random()*10; o.h=34+Math.random()*28; o.y=GROUND_Y-o.h; o.baseY=o.y; o.moveAmp=30+Math.random()*50; o.moveFreq=1.8+Math.random()*2.5; o.movePhase=Math.random()*Math.PI*2; break;
      case "spike":   o.w=12; o.h=55+Math.random()*25; o.y=GROUND_Y-o.h; break;
      case "double":  o.h=22+Math.random()*18; o.w=16+Math.random()*8; o.y=GROUND_Y-o.h; o.gap=36+Math.random()*20; break;
      case "ghost":   o.h=30+Math.random()*34; o.w=20+Math.random()*14; o.y=GROUND_Y-o.h; o.ghostAlpha=1; o.ghostDir=-1; break;
    }
    obstacles.push(o);
  }

  function spawnFirefly() {
    const h = 40 + Math.random() * 180;
    fireflies.push({
      x: W + 30 + Math.random() * 100,
      y: GROUND_Y - h,
      r: 4 + Math.random() * 3,
      phase: Math.random() * Math.PI * 2,
      collected: false,
    });
  }

  function spawnPetals(x, y, count) {
    for (let i = 0; i < count; i++)
      particles.push({ x, y, vx:(Math.random()-0.5)*80, vy:(Math.random()-0.8)*140, life:0.6+Math.random()*0.6, maxLife:0.6+Math.random()*0.6, r:1.5+Math.random()*3, color:Math.random()>0.5?"#e8b896":"#d4a08a" });
  }

  function spawnFireflyParticles(x, y) {
    for (let i = 0; i < 6; i++)
      particles.push({ x, y, vx:(Math.random()-0.5)*100, vy:(Math.random()-1)*160, life:0.3+Math.random()*0.4, maxLife:0.3+Math.random()*0.4, r:1+Math.random()*2, color:"#f5e8a0" });
  }

  // ---- 跳跃 ----
  function doJump(vy) {
    player.vy = vy;
    player.grounded = false;
    player.airJumps = 1;
  }

  // ---- 更新 ----
  function update(dt) {
    if (state === ST.IDLE || state === ST.VICTORY || state === ST.OVER) return;
    const cap = Math.min(dt, 0.05);
    time += cap;

    if (state === ST.LEVEL_UP) {
      levelUpTimer -= cap;
      if (levelUpTimer <= 0) {
        currentLevel++;
        if (currentLevel >= LEVELS.length) { completeGame(); return; }
        dodgedInLevel = 0; obstacles = []; fireflies = []; obstacleTimer = 0; fireflyTimer = 0;
        const c = getCfg(); speed = c.speed; obstacleInterval = c.interval;
        levelUpScreen.classList.add("hidden"); levelUpScreen.classList.remove("active");
        state = ST.PLAYING;
        player.y = GROUND_Y - PH; player.vy = 0; player.grounded = true; player.airJumps = 0;
        chargeHint.classList.remove("hidden");
      }
      for (let i = particles.length-1; i >= 0; i--) {
        const p = particles[i]; p.life -= cap;
        if (p.life <= 0) { particles.splice(i,1); continue; }
        p.x += p.vx*cap; p.y += p.vy*cap; p.vy += 300*cap;
      }
      return;
    }

    // 无敌倒计时
    if (player.invincible > 0) player.invincible -= cap;

    // 玩家物理
    player.vy += 1750 * cap;
    player.y += player.vy * cap;
    if (player.y >= GROUND_Y - PH) {
      player.y = GROUND_Y - PH; player.vy = 0; player.grounded = true; player.airJumps = 0;
    }

    // 蓄力计时
    if (charging && player.grounded) {
      const chargeLevel = Math.min((performance.now()/1000 - chargeStart) / CHARGE_MAX, 1);
      // 满蓄粒子提示
      if (chargeLevel >= 1 && Math.random() < cap * 8)
        particles.push({ x:player.x+PW/2+(Math.random()-0.5)*20, y:player.y+PH, vx:(Math.random()-0.5)*30, vy:-20-Math.random()*30, life:0.4, maxLife:0.4, r:2, color:"#e8b896" });
    }

    // 障碍物生成
    obstacleTimer += cap;
    if (obstacleTimer >= obstacleInterval) { obstacleTimer = 0; spawnObstacle(); }

    // 萤火虫生成
    fireflyTimer += cap;
    if (fireflyTimer >= 2.0 + Math.random() * 2.5) {
      fireflyTimer = 0;
      if (fireflies.length < 7) spawnFirefly();
    }

    // 障碍物更新
    for (let i = obstacles.length-1; i >= 0; i--) {
      const obs = obstacles[i];
      obs.x -= speed * (obs.speedMul||1) * cap;
      if (obs.type === "moving") { obs.movePhase += obs.moveFreq*cap; obs.y = obs.baseY + Math.sin(obs.movePhase)*obs.moveAmp; }
      if (obs.type === "ghost") { obs.ghostAlpha += obs.ghostDir*2.5*cap; if (obs.ghostAlpha<=0.15){obs.ghostAlpha=0.15;obs.ghostDir=1;} if (obs.ghostAlpha>=1){obs.ghostAlpha=1;obs.ghostDir=-1;} }

      if (player.invincible <= 0) {
        const px=player.x+5, py=player.y+4, pw=PW-10, ph=PH-8;
        let hit = false;
        if (obs.type === "double") {
          const g = obs.gap||40;
          hit = (px<obs.x+obs.w && px+pw>obs.x && py<obs.y+obs.h && py+ph>obs.y) ||
                (px<obs.x+obs.w+g+obs.w && px+pw>obs.x+obs.w+g && py<obs.y+obs.h && py+ph>obs.y);
        } else {
          const ox=obs.x+2, oy=obs.y+2, ow=obs.w-4, oh=obs.h-4;
          hit = px<ox+ow && px+pw>ox && py<oy+oh && py+ph>oy;
        }
        if (hit) {
          if (shields > 0) {
            shields--;
            player.invincible = 1.2;
            spawnFireflyParticles(player.x+PW/2, player.y+PH/2);
          } else {
            endGame(); return;
          }
        }
      }

      const sx = obs.type==="double" ? obs.x+obs.w+(obs.gap||40)+obs.w : obs.x+obs.w;
      if (!obs.scored && sx < player.x) { obs.scored=true; dodgedInLevel++; totalDodged++; if (dodgedInLevel >= getCfg().target) levelUp(); }
      if (obs.x < -80) obstacles.splice(i,1);
    }

    // 萤火虫更新与收集
    for (let i = fireflies.length-1; i >= 0; i--) {
      const f = fireflies[i];
      f.x -= speed * cap;
      f.phase += cap * 3;
      const fx = f.x, fy = f.y;
      if (Math.abs(fx - (player.x+PW/2)) < 22 && Math.abs(fy - (player.y+PH/2)) < 22) {
        fireflies.splice(i,1);
        fireflyCount++;
        spawnFireflyParticles(fx, fy);
        if (fireflyCount % FIREFLIES_PER_SHIELD === 0 && shields < MAX_SHIELDS) shields++;
      } else if (f.x < -30) {
        fireflies.splice(i,1);
      }
    }

    // 云
    for (const c of clouds) { c.x -= c.speed*cap; if (c.x < -c.w) c.x = W+c.w; }
    // 鸟
    for (const b of birds) { b.x += b.vx*cap; b.wing += cap*3; if (b.x > W+30) b.x = -30; }
    // 粒子
    for (let i = particles.length-1; i >= 0; i--) {
      const p = particles[i]; p.life -= cap;
      if (p.life <= 0) { particles.splice(i,1); continue; }
      p.x += p.vx*cap; p.y += p.vy*cap; p.vy += 300*cap;
    }
  }

  function levelUp() {
    state = ST.LEVEL_UP;
    levelUpTimer = 1.8;
    const c = getCfg();
    levelUpLabel.textContent = `第 ${c.n} 关 通过`;
    levelUpName.textContent = c.name;
    levelUpScreen.classList.remove("hidden"); levelUpScreen.classList.add("active");
    chargeHint.classList.add("hidden");
    spawnPetals(player.x+PW/2, player.y, 16);
  }

  function completeGame() {
    state = ST.VICTORY;
    if (currentLevel+1 > bestLevel) { bestLevel = currentLevel+1; localStorage.setItem("mosangBestLevel", bestLevel); }
    victoryPoem.textContent = POEMS[Math.floor(Math.random()*POEMS.length)];
    victoryScreen.classList.remove("hidden"); victoryScreen.classList.add("active");
    chargeHint.classList.add("hidden");
    spawnPetals(W/2, H/2, 40);
  }

  function endGame() {
    state = ST.OVER;
    spawnPetals(player.x+PW/2, player.y, 12);
    const rl = currentLevel+1;
    if (rl > bestLevel) { bestLevel = rl; localStorage.setItem("mosangBestLevel", bestLevel); }
    finalScoreEl.textContent = totalDodged;
    endLevelEl.textContent = rl;
    endDodgedEl.textContent = totalDodged;
    endFireflyEl.textContent = fireflyCount;
    endScreen.classList.remove("hidden"); endScreen.classList.add("active");
    chargeHint.classList.add("hidden");
  }

  // ---- 渲染 ----
  function drawSky(ctx) {
    const bg = ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,"#f5efe0"); bg.addColorStop(0.5,"#f0e4d0"); bg.addColorStop(1,"#eedac4");
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    const sun = ctx.createRadialGradient(W*0.7,H*0.25,20,W*0.7,H*0.25,200);
    sun.addColorStop(0,"rgba(255,242,230,0.5)"); sun.addColorStop(1,"rgba(255,242,230,0)");
    ctx.fillStyle=sun; ctx.fillRect(0,0,W,H);
  }

  function drawClouds(ctx) {
    for (const c of clouds) {
      ctx.fillStyle=`rgba(255,252,248,${c.alpha})`;
      ctx.beginPath(); ctx.ellipse(c.x, c.y, c.w*0.5, c.w*0.18, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(c.x-c.w*0.2, c.y-c.w*0.06, c.w*0.3, c.w*0.13, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(c.x+c.w*0.25, c.y-c.w*0.04, c.w*0.28, c.w*0.12, 0, 0, Math.PI*2); ctx.fill();
    }
  }

  function drawBirds(ctx) {
    for (const b of birds) {
      ctx.strokeStyle="#c4b5a0"; ctx.lineWidth=1.2; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(b.x-8, b.y-Math.sin(b.wing)*6);
      ctx.quadraticCurveTo(b.x-4, b.y-3-Math.sin(b.wing)*6, b.x, b.y-Math.sin(b.wing)*6);
      ctx.quadraticCurveTo(b.x+4, b.y-3-Math.sin(b.wing)*6, b.x+8, b.y-Math.sin(b.wing)*6);
      ctx.stroke();
    }
  }

  function drawMountains(ctx) {
    if (mountainPoints.length===0) generateMountains();
    ctx.fillStyle="#e2d2bd"; ctx.beginPath(); ctx.moveTo(mountainPoints[0].x,mountainPoints[0].y);
    for (let i=1;i<mountainPoints.length;i++) ctx.lineTo(mountainPoints[i].x,mountainPoints[i].y);
    ctx.lineTo(W+20,GROUND_Y+20); ctx.lineTo(-20,GROUND_Y+20); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#eaddcb"; ctx.beginPath(); ctx.moveTo(-20,GROUND_Y+20);
    for (let x=-20;x<=W+20;x+=25) ctx.lineTo(x,GROUND_Y-(25+Math.sin(x*0.012+0.7)*20+Math.sin(x*0.025)*15));
    ctx.lineTo(W+20,GROUND_Y+20); ctx.closePath(); ctx.fill();
  }

  function drawGround(ctx) {
    ctx.fillStyle="#c9a88c"; ctx.fillRect(0,GROUND_Y,W,H-GROUND_Y);
    ctx.fillStyle="#bfa07a"; ctx.fillRect(0,GROUND_Y,W,4);
    ctx.strokeStyle="rgba(139,111,94,0.3)"; ctx.lineWidth=1; ctx.setLineDash([4,12]);
    ctx.beginPath(); ctx.moveTo(0,GROUND_Y+10); ctx.lineTo(W,GROUND_Y+10); ctx.stroke(); ctx.setLineDash([]);
  }

  function drawPlayer(ctx) {
    const x=player.x, y=player.y;

    // 无敌闪烁
    if (player.invincible > 0 && Math.floor(player.invincible*10)%2===0) return;

    // 光晕
    const glow = ctx.createRadialGradient(x+PW/2,y+PH/2,4,x+PW/2,y+PH/2,32);
    glow.addColorStop(0,"rgba(232,184,150,0.35)"); glow.addColorStop(1,"rgba(232,184,150,0)");
    ctx.fillStyle=glow; ctx.fillRect(x-12,y-12,PW+24,PH+24);

    // 蓄力环
    if (charging && player.grounded) {
      const cl = Math.min((performance.now()/1000 - chargeStart)/CHARGE_MAX, 1);
      ctx.strokeStyle=`rgba(232,184,150,${0.3+cl*0.7})`; ctx.lineWidth=2+cl*3;
      ctx.beginPath(); ctx.arc(x+PW/2, y+PH, 8+cl*16, Math.PI, 0); ctx.stroke();

      // 满蓄光圈
      if (cl >= 1) {
        ctx.strokeStyle="rgba(232,184,150,0.6)"; ctx.lineWidth=1;
        ctx.beginPath(); ctx.arc(x+PW/2, y+PH, 28, 0, Math.PI*2); ctx.stroke();
      }
    }

    // 身体
    ctx.fillStyle="#8b6f5e"; ctx.beginPath(); ctx.roundRect(x,y,PW,PH,8); ctx.fill();
    ctx.fillStyle="rgba(255,248,240,0.25)"; ctx.beginPath(); ctx.roundRect(x+4,y+3,10,8,4); ctx.fill();
    ctx.fillStyle="#fffef9"; ctx.beginPath(); ctx.arc(x+20,y+13,4.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#3a2a1a"; ctx.beginPath(); ctx.arc(x+21,y+12,2.2,0,Math.PI*2); ctx.fill();

    // 二段跳提示
    if (!player.grounded && player.airJumps > 0) {
      ctx.fillStyle="rgba(232,184,150,0.25)";
      ctx.beginPath(); ctx.arc(x+PW/2, y+PH, 10, 0, Math.PI*2); ctx.fill();
    }
  }

  function drawFireflies(ctx) {
    for (const f of fireflies) {
      const pulse = 0.6 + Math.sin(f.phase)*0.4;
      // 外光晕
      const g = ctx.createRadialGradient(f.x, f.y, 1, f.x, f.y, f.r*3);
      g.addColorStop(0, `rgba(255,248,200,${0.7*pulse})`);
      g.addColorStop(1, "rgba(255,248,200,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(f.x, f.y, f.r*3, 0, Math.PI*2); ctx.fill();
      // 核心
      ctx.fillStyle=`rgba(255,250,220,${pulse})`;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r*pulse, 0, Math.PI*2); ctx.fill();
    }
  }

  // ---- 障碍物绘制 ----
  function drawStone(ctx,x,y,w,h,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y+4,w,h-4,w*0.5);ctx.fill();ctx.fillStyle="rgba(255,248,240,0.2)";ctx.beginPath();ctx.arc(x+w*0.35,y+h*0.35,w*0.2,0,Math.PI*2);ctx.fill();}
  function drawShrub(ctx,x,y,w,h){ctx.fillStyle="#8b7a62";ctx.fillRect(x+w*0.4,y+h*0.3,w*0.2,h*0.7);ctx.beginPath();ctx.arc(x+w/2,y+h*0.25,w*0.7,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+w*0.25,y+h*0.35,w*0.45,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+w*0.75,y+h*0.3,w*0.5,0,Math.PI*2);ctx.fill();}
  function drawCritter(ctx,x,y,w,h){ctx.fillStyle="#e8b896";ctx.beginPath();ctx.ellipse(x+w*0.6,y+h*0.5,w*0.5,h*0.4,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+w*0.7,y+h*0.15,w*0.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+w*0.45,y+h*0.2,w*0.18,0,Math.PI*2);ctx.fill();}
  function drawLeafCluster(ctx,x,y,w,h){for(let i=0;i<5;i++){ctx.fillStyle=i%2===0?"#b8a99a":"#c9a88c";ctx.beginPath();ctx.ellipse(x+Math.cos(i*1.3+time*2)*w*0.4,y+Math.sin(i*0.9+time*1.5)*h*0.5,6,3,0.3,0,Math.PI*2);ctx.fill();}}
  function drawBamboo(ctx,x,y,w,h){ctx.fillStyle="#8b6f5e";ctx.fillRect(x+w*0.4,y,w*0.2,h);for(let jy=y+h*0.15;jy<y+h;jy+=h*0.2){ctx.fillStyle="#7a5f4e";ctx.fillRect(x+w*0.3,jy,w*0.4,2);ctx.fillStyle="#8b6f5e";}ctx.fillStyle="#9b8a72";ctx.beginPath();ctx.ellipse(x+w*0.6,y+h*0.2,w*0.5,w*0.12,0.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(x+w*0.2,y+h*0.5,w*0.4,w*0.1,-0.3,0,Math.PI*2);ctx.fill();}
  function drawSpike(ctx,x,y,w,h){ctx.fillStyle="#a0846c";ctx.beginPath();ctx.moveTo(x,y+h);ctx.lineTo(x+w/2,y);ctx.lineTo(x+w,y+h);ctx.closePath();ctx.fill();}
  function drawMist(ctx,x,y,w,h){ctx.fillStyle="rgba(245,239,224,0.45)";ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,w*0.6,h*0.5,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(x+w*0.35,y+h*0.4,w*0.4,h*0.35,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(x+w*0.65,y+h*0.55,w*0.35,h*0.3,0,0,Math.PI*2);ctx.fill();}

  function drawObstacles(ctx) {
    for (const obs of obstacles) {
      ctx.globalAlpha = obs.type==="ghost" ? (obs.ghostAlpha||1) : 1;
      if (obs.type==="double") {
        const g=obs.gap||40; drawStone(ctx,obs.x,obs.y,obs.w,obs.h,"#d4a08a"); drawStone(ctx,obs.x+obs.w+g,obs.y,obs.w,obs.h,"#d4a08a");
      } else switch(obs.type) {
        case "basic": drawStone(ctx,obs.x,obs.y,obs.w,obs.h,"#c9a88c"); break;
        case "tall": drawShrub(ctx,obs.x,obs.y,obs.w,obs.h); break;
        case "fast": drawCritter(ctx,obs.x,obs.y,obs.w,obs.h); break;
        case "floating": drawLeafCluster(ctx,obs.x,obs.y,obs.w,obs.h); break;
        case "moving": drawBamboo(ctx,obs.x,obs.y,obs.w,obs.h); break;
        case "spike": drawSpike(ctx,obs.x,obs.y,obs.w,obs.h); break;
        case "ghost": drawMist(ctx,obs.x,obs.y,obs.w,obs.h); break;
      }
    }
    ctx.globalAlpha=1;
  }

  function drawParticles(ctx) {
    for (const p of particles) {
      const a=p.life/p.maxLife; ctx.fillStyle=p.color; ctx.globalAlpha=a;
      ctx.beginPath(); ctx.ellipse(p.x,p.y,p.r*a,p.r*0.5*a,Math.random(),0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  function drawHUD(ctx) {
    if (state !== ST.PLAYING && state !== ST.LEVEL_UP) return;
    const c = getCfg(), lvl = c.n;

    // 关卡
    ctx.fillStyle="#5c4a3a"; ctx.font="14px 'PingFang SC','Microsoft YaHei',serif"; ctx.textAlign="left";
    ctx.fillText(`第 ${lvl}/10 关 · ${c.name}`, 18, 34);

    // 进度条
    const bx=18, by=44, bw=W-36, bh=4;
    ctx.fillStyle="rgba(201,168,140,0.25)"; ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,2); ctx.fill();
    const pct = Math.min(dodgedInLevel/c.target, 1);
    ctx.fillStyle="#c8a082"; ctx.beginPath(); ctx.roundRect(bx,by,bw*pct,bh,2); ctx.fill();
    ctx.fillStyle="#8b7a62"; ctx.font="11px 'PingFang SC','Microsoft YaHei',serif"; ctx.textAlign="right";
    ctx.fillText(`${dodgedInLevel}/${c.target}`, W-18, by-4);

    // 萤火 & 护身
    ctx.textAlign="right";
    ctx.fillStyle="#8b7a62"; ctx.font="12px 'PingFang SC','Microsoft YaHei',serif";
    ctx.fillText(`萤火 ${fireflyCount}`, W-18, 74);
    if (shields > 0) ctx.fillText(`护身 ${shields}`, W-18, 92);

    ctx.textAlign="left";
  }

  function render() {
    ctx.clearRect(0,0,W,H);
    drawSky(ctx); drawClouds(ctx); drawBirds(ctx); drawMountains(ctx); drawGround(ctx);
    drawFireflies(ctx); drawObstacles(ctx); drawPlayer(ctx); drawParticles(ctx); drawHUD(ctx);
  }

  let lastTime=0, animId;
  function loop(ts) { const dt=lastTime?(ts-lastTime)/1000:0; lastTime=ts; update(dt); render(); animId=requestAnimationFrame(loop); }

  // ---- 输入 ----
  function handleDown(e) {
    e.preventDefault();
    if (state === ST.IDLE) { startGame(); return; }
    if (state !== ST.PLAYING) return;

    if (player.grounded) {
      charging = true;
      chargeStart = performance.now() / 1000;
    } else if (player.airJumps > 0) {
      // 空中二段跳
      player.vy = DOUBLE_JUMP_VY;
      player.airJumps = 0;
      spawnPetals(player.x+PW/2, player.y+PH, 6);
    }
  }

  function handleUp(e) {
    e.preventDefault();
    if (state !== ST.PLAYING) return;
    if (!charging) return;
    charging = false;
    if (!player.grounded) return;
    const held = performance.now()/1000 - chargeStart;
    const cl = Math.min(held / CHARGE_MAX, 1);
    const vy = JUMP_MIN + (JUMP_MAX - JUMP_MIN) * cl;
    doJump(vy);
  }

  canvas.addEventListener("pointerdown", handleDown);
  canvas.addEventListener("pointerup", handleUp);
  canvas.addEventListener("pointerleave", handleUp);
  canvas.addEventListener("touchstart", handleDown, { passive: false });
  canvas.addEventListener("touchend", handleUp);
  canvas.addEventListener("touchcancel", handleUp);

  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" || e.code === "ArrowUp") {
      e.preventDefault();
      if (state === ST.IDLE) { startGame(); return; }
      if (state !== ST.PLAYING) return;
      if (player.grounded) {
        // 键盘：按越久跳越高
        if (!charging) { charging = true; chargeStart = performance.now()/1000; }
      } else if (player.airJumps > 0) {
        player.vy = DOUBLE_JUMP_VY; player.airJumps = 0;
        spawnPetals(player.x+PW/2, player.y+PH, 6);
      }
    }
  });
  document.addEventListener("keyup", (e) => {
    if ((e.code === "Space" || e.code === "ArrowUp") && charging && state === ST.PLAYING && player.grounded) {
      charging = false;
      const held = performance.now()/1000 - chargeStart;
      const cl = Math.min(held/CHARGE_MAX, 1);
      doJump(JUMP_MIN + (JUMP_MAX-JUMP_MIN)*cl);
    }
  });

  function startGame() {
    reset();
    state = ST.PLAYING;
    [startScreen,endScreen,victoryScreen,levelUpScreen].forEach(el=>{el.classList.add("hidden");el.classList.remove("active");});
    chargeHint.classList.remove("hidden");
  }

  document.getElementById("btnStart").addEventListener("click",(e)=>{e.stopPropagation();startGame();});
  document.getElementById("btnRetry").addEventListener("click",(e)=>{e.stopPropagation();startGame();});
  document.getElementById("btnReplay").addEventListener("click",(e)=>{e.stopPropagation();startGame();});

  function doShare(){
    const rl=state===ST.VICTORY?10:(currentLevel+1);
    const extra=state===ST.VICTORY?`「${victoryPoem.textContent}」`:"";
    const text=`🏔️ 我在「莫桑」走到了第 ${rl} 关，收集 ${fireflyCount} 只萤火虫。${extra} 来山野间走一走吧！`;
    if(navigator.share) navigator.share({title:"莫桑",text,url:location.href});
    else navigator.clipboard.writeText(text+" "+location.href).then(()=>alert("分享文案已复制！")).catch(()=>prompt("复制这段分享吧：",text+" "+location.href));
  }

  document.getElementById("btnShare").addEventListener("click",(e)=>{e.stopPropagation();doShare();});
  document.getElementById("btnShareEnd").addEventListener("click",(e)=>{e.stopPropagation();doShare();});

  // 初始化
  function res(){canvas.width=W;canvas.height=H;}
  res(); window.addEventListener("resize",res);
  generateMountains(); initClouds(); initBirds();
  bestDisplay.textContent = bestLevel>0 ? `曾至 第 ${bestLevel} 关` : "按住蓄力 · 松手起跳";
  player.y = GROUND_Y - PH;
  lastTime = performance.now();
  animId = requestAnimationFrame(loop);
})();
</script>
</body>
</html>
