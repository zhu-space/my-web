<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>甲申 · Jiashen 1644</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0806;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;font-family:'SimSun','KaiTi',serif;user-select:none;-webkit-user-select:none}
#wrap{position:relative;width:100vw;height:100vh;max-width:960px;max-height:640px;overflow:hidden}
canvas{display:block;position:absolute;top:0;left:0;width:100%;height:100%}
#hud{position:absolute;z-index:10;pointer-events:none;top:0;left:0;right:0;bottom:0}
#hud>*{pointer-events:auto}
#title{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(24,18,10,0.3),rgba(2,1,0,0.97));z-index:20}
#title h1{font-size:3.5rem;color:#d4c8b0;letter-spacing:12px;font-weight:400;margin-bottom:6px}
#title .sub{font-size:0.7rem;color:#9a8b72;letter-spacing:5px;margin-bottom:44px}
#title .sh{font-size:0.65rem;color:#b8943e;animation:blink 2.2s infinite;letter-spacing:3px}
@keyframes blink{0%,100%{opacity:0.35}50%{opacity:1}}
#lineSel{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(6,5,4,0.94);z-index:21;gap:12px}
#lineSel.show{display:flex}
.lb{background:transparent;border:1px solid rgba(184,148,62,0.25);color:#d4c8b0;padding:20px 40px;font-family:inherit;font-size:1rem;cursor:pointer;letter-spacing:3px;width:260px;text-align:center;transition:all 0.3s}
.lb:hover{background:rgba(30,24,14,0.5);border-color:#b8943e}
.lb .ll{font-size:0.55rem;color:#9a8b72;margin-bottom:5px;letter-spacing:3px}
#ep{position:absolute;top:0;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;background:rgba(6,5,4,0.96);z-index:19;flex-direction:column}
#ep.show{display:flex}
#ep .en{font-size:0.65rem;color:#b8943e;letter-spacing:3px}
#ep .em{font-size:1.6rem;color:#d4c8b0;margin-top:8px;letter-spacing:5px;font-weight:400}
#ep .el{font-size:0.7rem;color:#9a8b72;margin-top:6px;letter-spacing:2px}
#dlg{position:absolute;bottom:0;left:0;right:0;padding:50px 32px 28px;display:none;cursor:pointer;z-index:12;background:linear-gradient(transparent,rgba(10,8,6,0.7) 25%,rgba(10,8,6,0.94))}
#dlg.show{display:block}
#dlg .s{font-size:0.65rem;color:#b8943e;margin-bottom:4px;letter-spacing:3px}
#dlg .t{font-size:1.02rem;color:#d4c8b0;line-height:2;letter-spacing:1.5px}
#dlg .h{text-align:right;font-size:0.6rem;color:#9a8b72;margin-top:8px;animation:blink 2.2s infinite}
#choices{position:absolute;bottom:0;left:0;right:0;padding:36px 32px 32px;display:none;z-index:12;background:linear-gradient(transparent,rgba(10,8,6,0.92) 15%)}
#choices.show{display:flex;flex-direction:column;gap:10px}
.ch{background:rgba(24,20,14,0.88);border:1px solid rgba(184,148,62,0.25);color:#d4c8b0;padding:15px 22px;font-family:inherit;font-size:0.9rem;cursor:pointer;text-align:left;letter-spacing:2px;transition:all 0.25s;border-radius:2px}
.ch:hover{background:rgba(32,26,16,0.9);border-color:#b8943e;padding-left:30px}
#snd{position:absolute;top:14px;right:18px;z-index:50;background:rgba(6,5,4,0.5);border:1px solid rgba(255,255,255,0.15);color:#9a8b72;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:0.85rem;display:flex;align-items:center;justify-content:center;transition:all 0.3s}
#snd:hover{border-color:#b8943e;color:#b8943e}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud">
    <button id="snd" onclick="toggleSound()">🔊</button>
    <div id="title"><h1>甲 申</h1><div class="sub">J I A S H E N · 1 6 4 4</div><div class="sh">点 击 开 始</div></div>
    <div id="lineSel">
      <button class="lb" onclick="startGame('A')"><div class="ll">第 一 线</div>士 · 国子监生</button>
      <button class="lb" onclick="startGame('B')"><div class="ll">第 二 线</div>海 · 走私船主</button>
      <button class="lb" onclick="startGame('C')"><div class="ll">第 三 线</div>隐 · 汉人旗兵</button>
    </div>
    <div id="ep"><div class="en"></div><div class="em"></div><div class="el"></div></div>
    <div id="dlg"><div class="s"></div><div class="t"></div><div class="h">点 击 继 续</div></div>
    <div id="choices"></div>
  </div>
</div>

<script>
(function(){
// ===== IMAGES =====
var imgCache={},imgLoading={};
function loadImg(key,src){
  imgLoading[key]=true;
  var i=new Image();
  i.onload=function(){imgCache[key]=i;imgLoading[key]=false;};
  i.onerror=function(){imgLoading[key]=false;};
  i.src=src;
}
loadImg('city_wall','bg_city.png');

// ===== AUDIO =====
var audioCtx=null,soundOn=true;
window.toggleSound=function(){soundOn=!soundOn;document.getElementById('snd').textContent=soundOn?'🔊':'🔇';if(audioCtx){if(soundOn)audioCtx.resume();else audioCtx.suspend()}};
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx}
var curAmb=null;
function setAmbient(type){
  if(curAmb){try{curAmb.stop()}catch(e){}curAmb=null}
  if(!soundOn||!type)return;
  try{
    var c=getAudio();if(c.state==='suspended')c.resume();
    var g=c.createGain();g.gain.value=0;g.connect(c.destination);
    if(type==='wind'){
      var buf=c.createBuffer(1,c.sampleRate*3,c.sampleRate);var d=buf.getChannelData(0);
      for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.06;
      var src=c.createBufferSource();src.buffer=buf;src.loop=true;
      var bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=200;bp.Q.value=0.3;
      src.connect(bp);bp.connect(g);g.gain.linearRampToValueAtTime(0.12,c.currentTime+0.5);src.start();
      curAmb={stop:function(){src.stop();g.gain.linearRampToValueAtTime(0,c.currentTime+0.6);setTimeout(function(){g.disconnect()},800)}};
    }else if(type==='rain'){
      buf=c.createBuffer(1,c.sampleRate*4,c.sampleRate);d=buf.getChannelData(0);
      for(i=0;i<d.length;i++)d[i]=Math.random()>0.65?(Math.random()*2-1)*0.06:d[i]*0.01;
      src=c.createBufferSource();src.buffer=buf;src.loop=true;
      bp=c.createBiquadFilter();bp.type='highpass';bp.frequency.value=600;
      src.connect(bp);bp.connect(g);g.gain.linearRampToValueAtTime(0.08,c.currentTime+0.4);src.start();
      curAmb={stop:function(){src.stop();g.gain.linearRampToValueAtTime(0,c.currentTime+0.3);setTimeout(function(){g.disconnect()},500)}};
    }else if(type==='fire'){
      buf=c.createBuffer(1,c.sampleRate*3,c.sampleRate);d=buf.getChannelData(0);
      for(i=0;i<d.length;i++){if(Math.random()>0.82)d[i]=(Math.random()*2-1)*0.08;else d[i]=d[Math.max(0,i-1)]*0.55}
      src=c.createBufferSource();src.buffer=buf;src.loop=true;
      bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=350;bp.Q.value=0.8;
      src.connect(bp);bp.connect(g);g.gain.linearRampToValueAtTime(0.06,c.currentTime+0.5);src.start();
      curAmb={stop:function(){src.stop();g.gain.linearRampToValueAtTime(0,c.currentTime+0.5);setTimeout(function(){g.disconnect()},800)}};
    }else if(type==='waves'){
      var o1=c.createOscillator();o1.type='sine';o1.frequency.value=0.06;var g1=c.createGain();g1.gain.value=0.012;o1.connect(g1);g1.connect(g);
      var o2=c.createOscillator();o2.type='triangle';o2.frequency.value=0.1;var g2=c.createGain();g2.gain.value=0.008;o2.connect(g2);g2.connect(g);
      o1.start();o2.start();g.gain.linearRampToValueAtTime(0.04,c.currentTime+0.8);
      curAmb={stop:function(){o1.stop();o2.stop();g.gain.linearRampToValueAtTime(0,c.currentTime+0.5);setTimeout(function(){g.disconnect()},800)}};
    }else if(type==='bell'){
      var ob=c.createOscillator();ob.type='sine';ob.frequency.value=523;
      var gb=c.createGain();gb.gain.value=0.08;gb.gain.exponentialRampToValueAtTime(0.001,c.currentTime+2);
      ob.connect(gb);gb.connect(g);g.gain.value=0.05;ob.start();ob.stop(c.currentTime+2.2);
      curAmb={stop:function(){ob.stop();g.gain.linearRampToValueAtTime(0,c.currentTime+0.3);setTimeout(function(){g.disconnect()},500)}};
    }
  }catch(e){}
}

// ===== STATE =====
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=function(){return cv.width},H=function(){return cv.height};
function resize(){cv.width=cv.parentElement.clientWidth;cv.height=cv.parentElement.clientHeight}
window.addEventListener('resize',resize);resize();

var world={};
try{world=JSON.parse(localStorage.getItem('js3'))||{};}catch(e){}
function saveW(){try{localStorage.setItem('js3',JSON.stringify(world))}catch(e){}}

var game={line:null,cs:null},sIdx=0,di=0,playing=false,loop=null,time=0;
var dlgBox=document.getElementById('dlg'),dlgS=dlgBox.querySelector('.s'),dlgT=dlgBox.querySelector('.t');
var choEl=document.getElementById('choices'),titleEl=document.getElementById('title'),lineEl=document.getElementById('lineSel'),epEl=document.getElementById('ep');
var PI=Math.PI,sin=Math.sin,cos=Math.cos,rand=Math.random;

// ===== DRAWING HELPERS =====
function ink(r,g,b,a){return'rgba('+r+','+g+','+b+','+(a||1)+')'}
function inkMtn(y0,vh,layers,r,g,b){
  var w=W(),h=H();
  for(var l=0;l<layers;l++){
    var alpha=0.08+l*0.05,y=y0+l*vh*0.25;
    ctx.fillStyle=ink(r,g,b,alpha);
    ctx.beginPath();ctx.moveTo(0,h);
    for(var x=0;x<=w;x+=10)ctx.lineTo(x,y+sin(x*0.005+l*1.3)*vh*0.7+sin(x*0.013+l*2.1)*vh*0.35+sin(x*0.002+l*0.6)*vh*0.2);
    ctx.lineTo(w,h);ctx.fill();
  }
}
function sky(stops){
  var w=W(),h=H(),g=ctx.createLinearGradient(0,0,0,h);
  for(var i=0;i<stops.length;i++)g.addColorStop(stops[i][0],'rgb('+stops[i][1]+','+stops[i][2]+','+stops[i][3]+')');
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
}
function moon(x,y,r,a){
  ctx.fillStyle=ink(200,190,160,a);ctx.beginPath();ctx.arc(x,y,r,0,PI*2);ctx.fill();
  ctx.fillStyle=ink(180,170,140,a*0.4);ctx.beginPath();ctx.arc(x,y,r*1.6,0,PI*2);ctx.fill();
}
function roof(cx,cy,w,rise,clr){
  ctx.fillStyle=clr;ctx.beginPath();ctx.moveTo(cx-w/2,cy);
  ctx.quadraticCurveTo(cx-w/2+10,cy-rise,cx,cy-rise-2);ctx.quadraticCurveTo(cx+w/2-10,cy-rise,cx+w/2,cy);
  ctx.lineTo(cx+w/2-2,cy+3);ctx.quadraticCurveTo(cx,cy-rise+4,cx-w/2+2,cy+3);ctx.fill();
}
function lantern(x,y,s,glow){
  if(glow){ctx.fillStyle=ink(200,120,40,0.2);ctx.beginPath();ctx.arc(x+s/2,y-s*0.4,s*2.5,0,PI*2);ctx.fill()}
  ctx.fillStyle=ink(160,40,30,0.85);ctx.beginPath();ctx.ellipse(x+s/2,y,s*0.7,s*1.2,0,0,PI*2);ctx.fill();
  ctx.fillStyle=ink(60,20,10,0.9);ctx.fillRect(x+s/2-2,y-s*1.4,4,3);
}
function scholar(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.globalAlpha=0.9;
  ctx.fillStyle=ink(12,10,8,0.85);ctx.beginPath();ctx.moveTo(-18,22);ctx.quadraticCurveTo(-22,16,-14,14);ctx.quadraticCurveTo(0,10,14,14);ctx.quadraticCurveTo(22,16,18,22);ctx.quadraticCurveTo(16,58,0,64);ctx.quadraticCurveTo(-16,58,-18,22);ctx.fill();
  ctx.fillStyle=ink(18,15,13,0.5);ctx.beginPath();ctx.moveTo(-10,22);ctx.quadraticCurveTo(-8,40,0,42);ctx.quadraticCurveTo(8,40,10,22);ctx.fill();
  ctx.fillStyle=ink(10,8,6,0.8);ctx.beginPath();ctx.moveTo(-22,18);ctx.quadraticCurveTo(-36,20,-38,28);ctx.quadraticCurveTo(-36,32,-24,26);ctx.fill();
  ctx.beginPath();ctx.moveTo(22,18);ctx.quadraticCurveTo(36,20,38,28);ctx.quadraticCurveTo(36,32,24,26);ctx.fill();
  ctx.fillStyle=ink(14,10,6,0.9);ctx.beginPath();ctx.arc(0,0,11,0,PI*2);ctx.fill();
  ctx.fillStyle=ink(6,4,2,0.9);ctx.fillRect(-14,-16,28,4);ctx.fillRect(-8,-22,16,8);
  ctx.fillStyle=ink(140,110,70,0.4);ctx.fillRect(-8,30,16,2.5);
  ctx.globalAlpha=1;ctx.restore();
}
function captain(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle=ink(10,8,7,0.85);ctx.beginPath();ctx.moveTo(-20,20);ctx.quadraticCurveTo(-24,16,-16,14);ctx.quadraticCurveTo(0,10,16,14);ctx.quadraticCurveTo(24,16,20,20);ctx.quadraticCurveTo(18,56,0,60);ctx.quadraticCurveTo(-18,56,-20,20);ctx.fill();
  ctx.fillStyle=ink(11,9,8,0.8);ctx.fillRect(-26,16,52,8);
  ctx.fillStyle=ink(9,7,6,0.8);ctx.beginPath();ctx.moveTo(-26,20);ctx.lineTo(-34,36);ctx.lineTo(-24,38);ctx.fill();
  ctx.beginPath();ctx.moveTo(26,20);ctx.lineTo(34,36);ctx.lineTo(24,38);ctx.fill();
  ctx.fillStyle=ink(14,10,6,0.9);ctx.beginPath();ctx.arc(0,0,12,0,PI*2);ctx.fill();
  ctx.fillStyle=ink(4,3,2,0.9);ctx.fillRect(-14,-12,28,4);
  ctx.globalAlpha=1;ctx.restore();
}
function bannerman(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle=ink(10,9,8,0.85);ctx.beginPath();ctx.moveTo(-16,16);ctx.quadraticCurveTo(-20,12,-14,10);ctx.quadraticCurveTo(0,6,14,10);ctx.quadraticCurveTo(20,12,16,16);ctx.quadraticCurveTo(14,52,0,56);ctx.quadraticCurveTo(-14,52,-16,16);ctx.fill();
  ctx.fillStyle=ink(16,14,12,0.8);ctx.fillRect(-22,14,8,12);ctx.fillRect(14,14,8,12);
  ctx.fillStyle=ink(14,10,6,0.9);ctx.beginPath();ctx.arc(0,0,11,0,PI*2);ctx.fill();
  ctx.fillStyle=ink(18,14,10,0.85);ctx.fillRect(-12,-4,24,4);ctx.fillRect(-5,-14,10,12);ctx.fillRect(-14,-4,28,2);
  ctx.globalAlpha=1;ctx.restore();
}
function wife(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle=ink(18,14,12,0.8);ctx.beginPath();ctx.moveTo(-12,18);ctx.quadraticCurveTo(-16,12,-10,10);ctx.quadraticCurveTo(0,6,10,10);ctx.quadraticCurveTo(16,12,12,18);ctx.quadraticCurveTo(10,52,0,56);ctx.quadraticCurveTo(-10,52,-12,18);ctx.fill();
  ctx.fillStyle=ink(16,12,10,0.75);ctx.beginPath();ctx.moveTo(-16,16);ctx.quadraticCurveTo(-26,20,-24,32);ctx.quadraticCurveTo(-20,30,-14,22);ctx.fill();
  ctx.beginPath();ctx.moveTo(16,16);ctx.quadraticCurveTo(26,20,24,32);ctx.quadraticCurveTo(20,30,14,22);ctx.fill();
  ctx.fillStyle=ink(18,12,8,0.85);ctx.beginPath();ctx.arc(0,0,9,0,PI*2);ctx.fill();
  ctx.fillStyle=ink(6,4,2,0.85);ctx.beginPath();ctx.ellipse(0,-10,10,14,0,0,PI*2);ctx.fill();
  ctx.globalAlpha=1;ctx.restore();
}

// ===== SCENE DRAWING =====
function draw_bg(id){
  var w=W(),h=H();
  switch(id){
  case'city_wall_dusk':
    var gx=w*0.42,gw=w*0.16;
    if(imgCache['city_wall']){ctx.drawImage(imgCache['city_wall'],0,0,w,h);}
    else{sky([[0,18,16,20],[0.45,28,24,30],[0.7,42,30,22],[1,20,14,8]]);inkMtn(h*0.38,h*0.12,5,8,5,6);ctx.fillStyle=ink(14,12,10,0.6);ctx.fillRect(0,h*0.48,w,h*0.52);ctx.fillStyle=ink(10,8,6,0.9);ctx.fillRect(0,h*0.5,w,h-w*0.5);
    for(var i=0;i<32;i++){ctx.fillStyle=ink(12,10,8,0.7);ctx.fillRect(i*(w/32),h*0.5,3,h*0.06)}
    for(i=0;i<20;i++){var bx=i*(w/19);ctx.fillStyle=ink(12,9,7,0.85);ctx.fillRect(bx,h*0.48,w/38+2,h*0.04)}
    ctx.fillStyle=ink(4,3,2,0.9);ctx.fillRect(gx,h*0.52,gw,h*0.12);ctx.fillStyle=ink(6,5,3,0.6);ctx.beginPath();ctx.arc(gx+gw/2,h*0.6,gw*0.44,PI,0);ctx.fill();}
    lantern(gx+8,h*0.46,7,true);lantern(gx+gw-14,h*0.46,7,true);
    for(i=0;i<8;i++)roof(w*0.22+i*w*0.07,h*0.48,18,8,ink(8,6,4,0.5));
    scholar(w*0.28,h*0.62,1.05);break;
  case'courtyard_night':sky([[0,6,5,12],[0.5,10,8,18],[1,8,7,10]]);moon(w*0.8,h*0.18,28,0.3);inkMtn(h*0.55,h*0.1,4,100,90,70);
    ctx.fillStyle=ink(12,10,8,0.8);ctx.fillRect(w*0.06,h*0.25,w*0.88,h*0.6);ctx.fillStyle=ink(8,7,6,0.85);ctx.fillRect(w*0.08,h*0.27,w*0.84,h*0.56);
    roof(w*0.5,h*0.25,w*0.9,24,ink(6,5,4,0.85));
    for(i=2;i<=8;i++){ctx.fillStyle=ink(14,12,10,0.7);ctx.fillRect(w*0.04*i+2,h*0.22,3,16)}
    ctx.fillStyle=ink(22,18,12,0.25);ctx.fillRect(w*0.38,h*0.36,14,18);ctx.fillStyle=ink(10,8,6,0.5);ctx.fillRect(w*0.38,h*0.36,14,1);ctx.fillRect(w*0.38,h*0.45,14,1);
    ctx.fillStyle=ink(10,8,6,0.4);ctx.fillRect(w*0.1,h*0.78,w*0.8,2);
    scholar(w*0.48,h*0.6,0.9);wife(w*0.56,h*0.63,0.8);
    ctx.fillStyle=ink(120,80,40,0.4);ctx.beginPath();ctx.ellipse(w*0.75+sin(time*0.03)*20,h*0.35+(time%60)*0.5,3,5,0.3,0,PI*2);ctx.fill();break;
  case'academy_dusk':sky([[0,12,10,10],[0.5,18,15,14],[1,10,8,8]]);inkMtn(h*0.5,h*0.08,3,6,4,4);
    ctx.fillStyle=ink(16,14,12,0.7);ctx.fillRect(w*0.12,h*0.3,w*0.76,h*0.5);ctx.fillStyle=ink(10,8,6,0.75);ctx.fillRect(w*0.15,h*0.32,w*0.7,h*0.45);
    roof(w*0.5,h*0.3,w*0.8,22,ink(5,4,3,0.8));
    ctx.fillStyle=ink(200,160,60,0.3);ctx.beginPath();ctx.arc(w*0.45,h*0.38,10,0,PI*2);ctx.fill();ctx.fillStyle=ink(220,180,80,0.5);ctx.fillRect(w*0.448,h*0.36,2,6);
    scholar(w*0.48,h*0.55,0.85);break;
  case'river_dawn':sky([[0,8,10,22],[0.5,14,20,32],[0.7,18,20,26],[1,10,14,18]]);ctx.fillStyle=ink(160,140,100,0.1);ctx.fillRect(w*0.2,h*0.08,w*0.6,h*0.1);
    inkMtn(h*0.48,h*0.1,5,6,6,8);ctx.fillStyle=ink(6,8,12,0.9);ctx.fillRect(0,h*0.55,w,h*0.45);ctx.fillStyle=ink(4,6,10,0.95);ctx.fillRect(0,h*0.6,w,h*0.4);
    for(i=0;i<20;i++){ctx.fillStyle=ink(180,180,190,0.15);ctx.fillRect(rand()*w,h*0.55+rand()*h*0.15,8+rand()*12,1)}
    var bxx=w*0.38,byy=h*0.62;ctx.fillStyle=ink(8,6,4,0.85);ctx.beginPath();ctx.moveTo(bxx,byy);ctx.quadraticCurveTo(bxx+w*0.06,byy+4,bxx+w*0.18,byy);ctx.quadraticCurveTo(bxx+w*0.16,byy-3,bxx+w*0.02,byy-3);ctx.fill();
    ctx.fillStyle=ink(12,10,8,0.8);ctx.fillRect(bxx+w*0.06,byy-8,3,10);
    scholar(w*0.4,h*0.65,0.9);break;

// ===== GAMEPLAY =====
function showScene(idx){
  sIdx=idx;di=0;var sl=scenes[game.line];if(!sl||idx>=sl.length){endGame();return}
  var sc=sl[idx];game.cs=sc;setAmbient(sc.ambient);
  if(sc.ep){var e=sc.ep;epEl.querySelector('.en').textContent=e.num;epEl.querySelector('.em').textContent=e.name;epEl.querySelector('.el').textContent=e.line;epEl.classList.add('show');setTimeout(function(){epEl.classList.remove('show');showDlg()},2800)}
  else showDlg();
  if(!loop)loop=requestAnimationFrame(gameLoop);
}
function gameLoop(){renderFrame();if(playing)loop=requestAnimationFrame(gameLoop)}
function showDlg(){var sc=scenes[game.line][sIdx];if(di>=sc.dlg.length){showCho(sc.cho);return}var d=sc.dlg[di];dlgS.textContent=d.s;dlgT.textContent=d.t;dlgBox.classList.add('show');choEl.classList.remove('show')}
dlgBox.onclick=function(){di++;showDlg()};
function showCho(chs){dlgBox.classList.remove('show');choEl.innerHTML='';chs.forEach(function(ch){var b=document.createElement('button');b.className='ch';b.textContent=ch.text;b.onclick=function(){choEl.classList.remove('show');dlgBox.classList.remove('show');if(ch.next==='end')endGame();else if(typeof ch.next==='number')showScene(ch.next)};choEl.appendChild(b)});choEl.classList.add('show')}
function endGame(){setAmbient(null);playing=false;dlgBox.classList.remove('show');choEl.classList.remove('show');dlgS.textContent='';dlgT.textContent='第一章 完';dlgBox.classList.add('show');setTimeout(function(){dlgBox.classList.remove('show');lineEl.classList.add('show');sIdx=0;di=0},3500)}

titleEl.onclick=function(){titleEl.style.display='none';lineEl.classList.add('show')};
window.startGame=function(line){
  game.line=line;sIdx=0;di=0;playing=true;lineEl.classList.remove('show');
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();showScene(0);
};
